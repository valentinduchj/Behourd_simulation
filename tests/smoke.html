<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Béhourd — tests smoke</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/screens.css">
  <link rel="stylesheet" href="../css/hub.css">
  <style>
    #results { font-family: Consolas, monospace; background: #111; color: #ddd; padding: 1rem; }
    #app, #modal-root, #toast-root { position: absolute; left: -10000px; width: 1300px; }
  </style>
</head>
<body>
  <pre id="results">EN COURS…</pre>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="boot-error" hidden></div>

  <script type="module">
    // Ce test sauvegarde puis restaure les données "behourd.*" existantes du navigateur.
    const lines = [];
    let failures = 0;
    const check = (condition, label) => {
      lines.push(`${condition ? 'OK  ' : 'FAIL'} ${label}`);
      if (!condition) failures++;
    };
    const wait = (ms = 0) => new Promise((resolve) => setTimeout(resolve, ms));
    const button = (text, root = document) =>
      [...root.querySelectorAll('button')].find((b) => b.textContent.trim().includes(text));
    const modal = () => document.querySelector('#modal-root .modal');
    const app = document.getElementById('app');
    const always = () => 0;     // rng : toujours réussir (et tirage minimal)
    const never = () => 0.999;  // rng : toujours échouer (et tirage maximal)

    window.addEventListener('error', (e) => { lines.push(`ERROR ${e.message}`); failures++; });
    window.addEventListener('unhandledrejection', (e) => { lines.push(`ERROR ${e.reason?.stack ?? e.reason}`); failures++; });

    const PREFIX = 'behourd.';
    const backup = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith(PREFIX)) backup[key] = localStorage.getItem(key);
    }
    const clearGameKeys = () => {
      for (const key of Object.keys({ ...localStorage })) if (key.startsWith(PREFIX)) localStorage.removeItem(key);
    };

    try {
      const { createNewGame, createRandomGame } = await import('../src/systems/game/newGame.js');
      const { Emblem } = await import('../src/models/Emblem.js');
      const { StorageBackend } = await import('../src/systems/storage/StorageBackend.js');
      const { SaveSystem } = await import('../src/systems/save/SaveSystem.js');
      const { createRng } = await import('../src/utils/random.js');
      const { SPECIALTY_IDS, SPECIALTIES } = await import('../src/data/specialties.js');
      const { renameFighter } = await import('../src/systems/roster/rosterSystem.js');
      const { recruit } = await import('../src/systems/tavern/TavernService.js');
      const { advanceDay } = await import('../src/systems/time/TimeSystem.js');
      const { assignActivity, listActivities, enforceActivityCapacities } = await import('../src/systems/activities/ActivityService.js');
      const { calculateFighterLevel: computeFighterLevel, calculateClubLevel: computeClubLevel, getStarRating: levelToStars } = await import('../src/systems/fighters/ratings.js');
      const { improveStat, worsenStat } = await import('../src/systems/fighters/stats.js');
      const { getOpponentTeams, getLeagueName, getSeasonFormat } = await import('../src/systems/league/LeagueService.js');
      const { LEAGUE_CONFIG } = await import('../src/data/leagues.js');
      const { getStandings, computeMatchPoints, getPromotionStatus } = await import('../src/systems/league/StandingsService.js');
      const { generateSchedule, validateSchedule, getNextMatch, isSeasonFinished } = await import('../src/systems/league/ScheduleService.js');
      const { calculateMovements, applyMovements, validateLeagueSizes } = await import('../src/systems/league/PromotionService.js');
      const {
        getSeasonProgress, isOffSeason, startNextSeason, completeMatchdayAndCheckSeason, backfillClubHistory,
      } = await import('../src/systems/league/SeasonService.js');
      const { GameSession } = await import('../src/state/GameSession.js');
      const getFixtures = (league, matchday) => league.schedule[matchday - 1];
      const { calculateWinProbability, simulateMatch, resolveRound, createMatch } = await import('../src/systems/match/MatchService.js');
      const { getPendingMatchdayEvent, createPlayerMatch, completeMatchday } = await import('../src/systems/match/MatchdayService.js');
      const { isCombatDay } = await import('../src/systems/calendar/CalendarService.js');
      const { createArena } = await import('../src/combat/Arena.js');
      const { LICE_DECORATIONS } = await import('../src/data/liceDecorations.js');
      const { SPECTATOR_SPRITES } = await import('../src/data/spectators.js');
      const { CROWD_LAYOUT } = await import('../src/data/crowd.js');
      const { buildLiceScenery, zoneOf } = await import('../src/combat/presentation/liceScenery.js');
      const { generateCrowd, listCrowdSlots } = await import('../src/combat/presentation/crowdLayout.js');
      const { buildLicePresentation } = await import('../src/combat/presentation/LicePresentation.js');
      const { calculateCrowdSize, getSharedRanks, getMatchCrowdSize } = await import('../src/systems/crowd/CrowdService.js');
      const { autoPlacements } = await import('../src/systems/match/MatchService.js');
      const { calculateLineupLevel } = await import('../src/systems/match/RoundService.js');
      const { getColorIntensity } = await import('../src/systems/fighters/FatigueService.js');
      const { getUpcomingHighlights, isTavernDay } = await import('../src/systems/calendar/CalendarService.js');
      const { EVENT_TYPES } = await import('../src/data/calendar.js');
      const { DAY_PHASES } = await import('../src/systems/time/dayPhases.js');
      const { CentreScene } = await import('../src/centre/CentreScene.js');
      const { clubDatabase } = await import('../src/systems/clubs/ClubDatabase.js');
      const { FIGHTER_SPRITES } = await import('../src/data/sprites.js');
      const { checkRecruit } = await import('../src/systems/tavern/TavernService.js');
      const {
        generateChampionshipDates, resolveCombatDayConflicts, getTimelineEvents, getPendingQueenEvent, hasFixedCombatOn,
      } = await import('../src/systems/calendar/CalendarService.js');
      const { getEventType } = await import('../src/data/calendar.js');
      const { SEASON_CONFIG } = await import('../src/data/leagues.js');
      const { MATCH_RULES } = await import('../src/data/matchRules.js');
      const {
        generateOpponentOptions, getOpponentPool, getClubStars, getBaseReward, generateQueenCombat, selectOpponent, sortOptionsByStars, calculateReward,
        generateSecondaryMatches, validateQueenDraw, simulateSecondaryMatches, getEligibleClubIds,
        createQueenMatch, resolveQueenCombat,
      } = await import('../src/systems/queen/QueenCombatService.js');
      const { MAX_TEAM_FIGHTERS } = await import('../src/data/roster.js');
      const { canRecruit, canDismiss, dismiss } = await import('../src/systems/roster/RosterService.js');
      const { getDeniers } = await import('../src/systems/economy/wallet.js');
      const { createRandomTeam } = await import('../src/systems/game/teamFactory.js');
      const { autoSelectSquad } = await import('../src/systems/match/MatchService.js');
      const {
        listSavedTeams: listSavedTeamsUI, createSavedTeam: createSavedTeamUI, updateSavedTeam: updateSavedTeamST, deleteSavedTeam: deleteSavedTeamST,
        loadSavedTeam: loadSavedTeamST, describeIncompleteTeam: describeIncompleteST, selectTypeTeam: selectTypeTeamST, cleanTeamName: cleanTeamNameST,
      } = await import('../src/systems/match/SavedTeamService.js');
      const { SAVED_TEAM_RULES: savedTeamRules } = await import('../src/data/savedTeams.js');

      // Base de clubs isolée pour les tests (aucune modification locale de l'utilisateur).
      const clubStorage = new StorageBackend('behourd-smoketest-clubs.');
      for (const key of clubStorage.keys()) clubStorage.remove(key);
      await clubDatabase.init(clubStorage).load();
      check(LEAGUE_CONFIG.teamCount === 18 && LEAGUE_CONFIG.promotionCount === 3 && LEAGUE_CONFIG.relegationCount === 3 && LEAGUE_CONFIG.singleRoundRobin, 'configuration centrale : 18 équipes, 3 montées, 3 descentes, aller simple');
      const format18 = getSeasonFormat();
      check(format18.matchdays === 17 && format18.matchesPerMatchday === 9 && format18.matchesPerTeam === 17 && format18.totalMatches === 153, 'format dérivé : 17 journées de 9 combats, 153 combats par ligue');
      check(['league_1', 'league_2', 'league_3'].map((id) => clubDatabase.getClubIdsOfLeague(id).length).join() === '18,18,17', 'base de clubs : 18 / 18 / 17 clubs IA chargés depuis data/leagues/');
      check(clubDatabase.getClubIdsOfLeague('reserve').length === 14 && clubDatabase.getExpectedClubCount('reserve') === null, 'base de clubs : 14 clubs hors championnat (réserve)');
      check(clubDatabase.validateCompositions().length === 0, 'base de clubs : compositions conformes');
      // Répartition des clubs de l'IA par niveau dans une nouvelle partie.
      const { distributeClubsByLevel } = await import('../src/systems/league/SeasonService.js');
      const toyLevels = { a: 10, b: 50, c: 30, d: 90, e: 30, f: 70 };
      const toy = distributeClubsByLevel({ league_1: ['a', 'b'], league_2: ['c', 'd'], league_3: ['e', 'f'] }, (id) => toyLevels[id]);
      check(LEAGUE_CONFIG.initialDistribution === 'level' && toy.league_1.join() === 'd,f' && toy.league_2.join() === 'b,c' && toy.league_3.join() === 'e,a',
        'répartition : les plus forts en Ligue 1, les suivants en Ligue 2, les plus faibles en Ligue 3 ; tailles conservées ; égalité → ordre des fichiers (c avant e)');
      const distGame = createRandomGame({ rng: createRng('repartition') });
      const fileLevel = (id) => computeClubLevel(clubDatabase.getFightersOfClub(id));
      const aiOf = (lg) => distGame.getLeague(lg).teamIds.filter((id) => id !== distGame.player.teamId);
      const [d1, d2, d3] = ['league_1', 'league_2', 'league_3'].map((lg) => aiOf(lg).map(fileLevel));
      const fileClubs = ['league_1', 'league_2', 'league_3'].flatMap((lg) => clubDatabase.getClubIdsOfLeague(lg)).sort();
      check(Math.min(...d1) >= Math.max(...d2) && Math.min(...d2) >= Math.max(...d3) && d1.length === 18 && d2.length === 18 && d3.length === 17
        && distGame.getLeague('league_3').teamIds.includes(distGame.player.teamId) && ['league_1', 'league_2', 'league_3'].flatMap(aiOf).sort().join() === fileClubs.join(),
        `nouvelle partie : clubs répartis par niveau — L1 ${Math.min(...d1).toFixed(1)}–${Math.max(...d1).toFixed(1)}, L2 ${Math.min(...d2).toFixed(1)}–${Math.max(...d2).toFixed(1)}, L3 ${Math.min(...d3).toFixed(1)}–${Math.max(...d3).toFixed(1)} (+ le joueur) ; les 53 clubs engagés`);
      // ---------- Géographie : Terres, lieux, localisation des clubs ----------
      const { getLands, getMapLands, getLand } = await import('../src/systems/geography/LandService.js');
      const { getLocations, getLocation, getStartLocations } = await import('../src/systems/geography/LocationService.js');
      const { getTeamLocation, sameLand, sameLocation, validateClubLocations, pickDefaultStartLocationId } = await import('../src/systems/geography/GeographyService.js');
      const { serializeSession: serializeGeo, deserializeSession: deserializeGeo } = await import('../src/systems/save/serialization.js');
      const { initializeWorld: initializeGeoWorld } = await import('../src/systems/game/worldSetup.js');
      const serializeSessionForGeo = (s) => serializeGeo(s, Date.now());
      const loadSaveForGeo = async (file) => {
        const loaded = deserializeGeo(JSON.parse(JSON.stringify(file)));
        initializeGeoWorld(loaded, createRng('geo-load'));
        return loaded;
      };
      const mapLands = getMapLands('fr');
      check(mapLands.map((l) => `${l.shortName}:${l.color}`).join() === 'Ouest:#d9822b,Nord:#2f5ea0,Centre:#3e7d3a,Sud:#8a5a32'
        && getLand('OUEST').regions.join() === 'Normandie,Bretagne,Pays de la Loire' && getLand('NORD').regions.join() === 'Île-de-France,Hauts-de-France,Grand Est'
        && getLand('CENTRE').regions.join() === 'Centre-Val de Loire,Bourgogne-Franche-Comté,Auvergne-Rhône-Alpes' && getLand('SUD').regions.join() === 'Nouvelle-Aquitaine,Occitanie,Provence,Corse',
        'Terres : Ouest (orange), Nord (bleu), Centre (vert), Sud (marron), avec leurs régions');
      check(getLands().length === 5 && getLand('LOINTAINE').name === 'Terre lointaine' && !getLand('LOINTAINE').countryId && !mapLands.includes(getLand('LOINTAINE')), 'Terres : la Terre lointaine existe, hors de la carte de France');
      check(getStartLocations('OUEST').map((l) => l.name).join() === 'Les Andelys,Château de Caen,Tour d’Oudon,Le Jardin aux Moines,Cité de Locronan,Abbaye de Maillezais'
        && getStartLocations('NORD').map((l) => l.name).join() === 'Faubourg de Lille,Parc Saint-Pierre,Château de Pierrefonds,Champ de Crécy,Foire de Provins,Remparts de Langres'
        && getStartLocations('CENTRE').map((l) => l.name).join() === 'Château de la Roche,Sentier de Morez,Donjon de Bressieux,Orée des Monts d’Ardèche,Palais Jacques-Cœur,Colline de Vézelay'
        && getStartLocations('SUD').map((l) => l.name).join() === 'Cité de Carcassonne,Tour de Campomoro,Moulin de Bargemon,Château de Cascastel,Cité de Saint-Émilion,Tours de La Rochelle',
        'lieux de départ : exactement 6 par Terre, ceux demandés');
      // Les 8 lieux ajoutés en v0.58 : chacun à plus de 40 km de tout autre lieu.
      const kmBetween = ([lonA, latA], [lonB, latB]) => Math.hypot((lonA - lonB) * 111 * Math.cos(((latA + latB) / 2) * Math.PI / 180), (latA - latB) * 111);
      const addedPlaces = ['cite-de-locronan', 'abbaye-de-maillezais', 'foire-de-provins', 'remparts-de-langres', 'palais-jacques-coeur', 'colline-de-vezelay', 'cite-de-saint-emilion', 'tours-de-la-rochelle'];
      const crowded = addedPlaces.filter((id) => getLocations().some((other) => other.id !== id && other.coords && kmBetween(getLocation(id).coords, other.coords) < 40));
      check(crowded.length === 0 && getLocation('cite-de-saint-emilion').landId === 'SUD' && getLocation('tours-de-la-rochelle').landId === 'SUD',
        `lieux ajoutés : 2 par Terre, aucun collé à un autre lieu, l’Aquitaine représentée (Saint-Émilion)${crowded.length ? ` — trop proches : ${crowded.join(', ')}` : ''}`);
      const insideRing = ([x, y], ring) => ring.reduce((inside, [xi, yi], i) => {
        const [xj, yj] = ring[(i + ring.length - 1) % ring.length];
        return ((yi > y) !== (yj > y)) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi ? !inside : inside;
      }, false);
      const mapLocations = getLocations().filter((l) => getLand(l.landId)?.countryId);
      const misplaced = mapLocations.filter((l) => !getLand(l.landId).polygons.some((ring) => insideRing(l.coords, ring)));
      check(new Set(getLocations().map((l) => l.id)).size === getLocations().length && getLocations().every((l) => getLand(l.landId)) && misplaced.length === 0,
        `lieux : identifiants uniques, chaque lieu dans le contour de sa Terre${misplaced.length ? ` — hors contour : ${misplaced.map((l) => l.name).join(', ')}` : ''}`);
      const leagueClubs = ['league_1', 'league_2', 'league_3'].flatMap((id) => clubDatabase.getClubIdsOfLeague(id));
      check(leagueClubs.length === 53 && leagueClubs.every((id) => clubDatabase.getTeam(id).landId !== 'LOINTAINE' && getLocation(clubDatabase.getTeam(id).locationId)?.landId === clubDatabase.getTeam(id).landId)
        && validateClubLocations(clubDatabase, ['league_1', 'league_2', 'league_3']).length === 0,
        'clubs : les 53 clubs des ligues ont une Terre et un lieu propres (aucun doublon)');
      check(clubDatabase.getTeam('club_102').locationId === 'chateau-de-vincennes' && clubDatabase.getTeam('club_102').landId === 'NORD'
        && clubDatabase.getTeam('club_205').locationId === 'bois-de-cergy' && clubDatabase.getTeam('club_205').landId === 'NORD',
        'clubs : Martel → Nord, Château de Vincennes ; Martel La Hire → Nord, Bois de Cergy');
      check(clubDatabase.getClubIdsOfLeague('reserve').every((id) => clubDatabase.getTeam(id).landId === 'LOINTAINE'), 'clubs hors championnat : Terre lointaine');
      check(sameLand(clubDatabase.getTeam('club_102'), clubDatabase.getTeam('club_205')) && !sameLocation(clubDatabase.getTeam('club_102'), clubDatabase.getTeam('club_205'))
        && !sameLand(clubDatabase.getTeam('club_102'), clubDatabase.getTeam('club_107')), 'géographie : même Terre / même lieu entre deux clubs (préparation domicile / extérieur)');
      const crecyGame = createNewGame({ teamName: 'Les Archers', emblem: new Emblem(), rng: createRng('crecy'), locationId: 'champ-de-crecy' });
      check(crecyGame.playerTeam.locationId === 'champ-de-crecy' && crecyGame.playerTeam.landId === 'NORD' && getTeamLocation(crecyGame.playerTeam).land.color === '#2f5ea0'
        && crecyGame.getLeagueOfTeam(crecyGame.playerTeam.id).id === 'league_3', 'nouvelle partie : lieu de départ choisi (Champ de Crécy, Nord), départ en Ligue 3');
      const badPlace = createNewGame({ teamName: 'Les Égarés', emblem: new Emblem(), rng: createRng('crecy'), locationId: 'chateau-de-vincennes' });
      check(badPlace.playerTeam.locationId === pickDefaultStartLocationId('Les Égarés') && getLocation(badPlace.playerTeam.locationId).type === 'start', 'nouvelle partie : un lieu qui n’est pas un lieu de départ est refusé (lieu par défaut)');
      const randomA = createRandomGame({ rng: createRng('geo') });
      const randomB = createRandomGame({ rng: createRng('geo') });
      check(getLocation(randomA.playerTeam.locationId)?.type === 'start' && randomA.playerTeam.locationId === randomB.playerTeam.locationId && randomA.playerTeam.name === randomB.playerTeam.name,
        'partie aléatoire : lieu de départ déterministe, sans changer le tirage de la partie');
      const geoSave = JSON.parse(JSON.stringify(serializeSessionForGeo(crecyGame)));
      check(geoSave.data.teams[0].locationId === 'champ-de-crecy' && geoSave.data.teams[0].landId === 'NORD', 'sauvegarde : Terre et lieu de la compagnie enregistrés');
      delete geoSave.data.teams[0].locationId;
      delete geoSave.data.teams[0].landId;
      const geoBefore = JSON.stringify({ fighters: geoSave.data.fighters, player: geoSave.data.player, leagues: geoSave.data.leagues });
      const geoLoaded = await loadSaveForGeo(geoSave);
      const geoLoadedAgain = await loadSaveForGeo(geoSave);
      const after = JSON.parse(JSON.stringify(serializeSessionForGeo(geoLoaded))).data;
      check(getLocation(geoLoaded.playerTeam.locationId)?.type === 'start' && geoLoaded.playerTeam.landId === getLocation(geoLoaded.playerTeam.locationId).landId
        && geoLoaded.playerTeam.locationId === geoLoadedAgain.playerTeam.locationId && geoLoaded.playerTeam.locationId === pickDefaultStartLocationId(geoLoaded.playerTeam.id),
        'ancienne sauvegarde : la compagnie reçoit un lieu de départ par défaut, toujours le même');
      check(JSON.stringify({ fighters: after.fighters, player: after.player, leagues: after.leagues }) === geoBefore, 'ancienne sauvegarde : migration sans toucher aux autres données');
      // Admin : Terre et lieu d'un club.
      clubDatabase.updateClub('club_102', { locationId: 'chateau-de-pierrefonds' });
      check(clubDatabase.getTeam('club_102').locationId === 'chateau-de-pierrefonds' && clubDatabase.getClubData('club_102').locationId === 'chateau-de-pierrefonds'
        && JSON.parse(clubDatabase.exportLeague('league_1')).clubs.find((c) => c.id === 'club_102').locationId === 'chateau-de-pierrefonds', 'admin : lieu d’un club modifié, enregistré et exporté');
      let unknownPlace = false;
      try { clubDatabase.updateClub('club_102', { locationId: 'atlantide' }); } catch { unknownPlace = true; }
      check(unknownPlace && clubDatabase.getTeam('club_102').locationId === 'chateau-de-pierrefonds', 'admin : un lieu inconnu est refusé');
      clubDatabase.updateClub('club_115', { locationId: 'cite-de-carcassonne' });
      check(clubDatabase.getTeam('club_115').landId === 'SUD', 'admin : un club hors championnat peut recevoir un lieu en France');
      clubDatabase.resetToFile('league_1');
      clubDatabase.resetToFile('reserve');
      check(clubDatabase.getTeam('club_102').locationId === 'chateau-de-vincennes' && clubDatabase.getTeam('club_115').landId === 'LOINTAINE', 'admin : retour au fichier → lieux par défaut');

      // ---------- Domicile / extérieur des matchs de Ligue ----------
      const { getEventLocation, ensureMatchLocations, locationForMatchIndex } = await import('../src/systems/league/MatchLocationService.js');
      const { getMatchVenue, getClubLocationInfo } = await import('../src/systems/league/VenueService.js');
      const { computeHomeReward, getHomeRewardRange } = await import('../src/systems/league/HomeRewardService.js');
      const { buildLicePresentation: buildVenuePresentation } = await import('../src/combat/presentation/LicePresentation.js');
      const { buildLiceScenery: buildVenueScenery } = await import('../src/combat/presentation/liceScenery.js');
      const { createArena: createVenueArena } = await import('../src/combat/Arena.js');
      const { createPlayerMatch: createVenueMatch, completeMatchday: completeVenueMatchday, buildPlayerResultEvent: venueResultEvent } = await import('../src/systems/match/MatchdayService.js');
      const { startSeason: startVenueSeason } = await import('../src/systems/league/SeasonService.js');
      const { HOME_REWARD_BY_LICE_LEVEL } = await import('../src/data/homeAway.js');
      const { formatLogbook: formatVenueLogbook } = await import('../src/ui/report/logbookFormats.js');
      const { DailyReport: VenueDailyReport } = await import('../src/systems/report/DailyReportService.js');
      const { getDeniers: venueDeniers } = await import('../src/systems/economy/wallet.js');
      const { serializeSession: serializeVenue, deserializeSession: deserializeVenue } = await import('../src/systems/save/serialization.js');
      const { initializeWorld: initVenueWorld } = await import('../src/systems/game/worldSetup.js');
      const venueGame = createNewGame({ teamName: 'Les Hôtes', emblem: new Emblem({ colors: { primary: 'gueules', secondary: 'or', tertiary: 'azur' } }), rng: createRng('domicile'), locationId: 'chateau-de-caen' });
      const venuePlayer = venueGame.player.teamId;
      const { CHAMPIONSHIP_MATCH: VENUE_MATCH, QUEEN_COMBAT: VENUE_QUEEN } = await import('../src/data/calendar.js');
      const leagueEvents = (s, season = s.season.number) => s.calendar.events.filter((e) => e.typeId === VENUE_MATCH && e.data?.season === season).sort((a, b) => a.data.matchday - b.data.matchday);
      const venueEvents = leagueEvents(venueGame);
      const pattern = venueEvents.map((e) => getEventLocation(e)).join(',');
      const fixturesOk = venueEvents.every((e) => {
        const fixture = venueGame.playerLeague.schedule[e.data.matchday - 1].find((f) => f.teamAId === venuePlayer || f.teamBId === venuePlayer);
        return fixture.homeTeamId === (getEventLocation(e) === 'HOME' ? venuePlayer : e.data.opponentTeamId);
      });
      check(venueEvents.length === 17 && pattern === venueEvents.map((_, i) => (i % 2 ? 'AWAY' : 'HOME')).join() && fixturesOk && locationForMatchIndex(0) === 'HOME' && locationForMatchIndex(5) === 'AWAY',
        'domicile : 1er match de Ligue à domicile, puis alternance stricte ; lieu enregistré sur le match et sur la rencontre de la division');
      const queenOnes = venueGame.calendar.events.filter((e) => e.typeId === VENUE_QUEEN);
      const daysOrder = [...venueGame.calendar.events].filter((e) => getEventLocation(e) || queenOnes.includes(e)).sort((a, b) => a.day - b.day);
      check(queenOnes.length > 0 && queenOnes.every((e) => getEventLocation(e) === null && !e.data.location) && daysOrder.some((e) => queenOnes.includes(e))
        && daysOrder.filter((e) => getEventLocation(e)).map((e) => getEventLocation(e)).join() === pattern,
        'domicile : les Combats de la Reine n’ont pas de lieu et ne décalent jamais l’alternance');
      const venueSaved = JSON.parse(JSON.stringify(serializeVenue(venueGame, Date.now())));
      const venueReloaded = deserializeVenue(JSON.parse(JSON.stringify(venueSaved)));
      check(leagueEvents(venueReloaded).map((e) => getEventLocation(e)).join() === pattern, 'domicile : le lieu de chaque match est conservé dans la sauvegarde');
      venueSaved.data.calendar.events.forEach((e) => { delete e.data.location; });
      venueSaved.data.leagues.forEach((l) => l.schedule.forEach((round) => round.forEach((f) => { delete f.homeTeamId; })));
      const legacyVenue = deserializeVenue(JSON.parse(JSON.stringify(venueSaved)));

      check([1, 3, 4, 15, 16, 18].map((rank) => getPromotionStatus('league_2', rank)?.direction ?? '-').join() === 'up,up,-,-,down,down', 'zones : Ligue 2 ▲ 1-3, ▼ 16-18');
      check(getPromotionStatus('league_1', 1) === null && getPromotionStatus('league_1', 16)?.direction === 'down' && getPromotionStatus('league_1', 15) === null && getPromotionStatus('league_3', 18) === null && getPromotionStatus('league_3', 3)?.direction === 'up', 'zones : L1 ▼ 16-18, pas de montée en Ligue 1, pas de descente en Ligue 3');
      // Ancienne saison (divisions de 19) : ramenée à 3 × 18, le surplus quitte le championnat par le bas, jamais le joueur.
      const ranks19 = Object.fromEntries(['league_1', 'league_2', 'league_3'].map((id) => [id, Array.from({ length: 19 }, (_, i) => `${id}-${i + 1}`)]));

      check(validateLeagueSizes(oldCompo) && oldCompo.league_3.includes('league_3-19') && oldMoves.filter((m) => m.ruleId === 'withdrawal').length === 3 && oldMoves.filter((m) => m.to === null).every((m) => m.from === 'league_3'), 'transition 19 → 18 : 3 × 18 équipes, 3 clubs IA quittent la Ligue 3, jamais le joueur');
      const shortCompo = applyMovements({ league_1: fake.league_1, league_2: fake.league_2.slice(0, 17), league_3: fake.league_3 }, calculateMovements({ league_1: fake.league_1, league_2: fake.league_2.slice(0, 17), league_3: fake.league_3 }), { reserve: ['r1', 'r2'] });
      check(validateLeagueSizes(shortCompo) && shortCompo.league_3.includes('r1'), 'sous-effectif : complété par la réserve');

      // ---------- Clubs adverses : données, score, niveau, Admin ----------
      const spriteIds = new Set(FIGHTER_SPRITES.map((s) => s.id));
      check(fighters.every((f) => isValidSprite(f.specialtyId, f.spriteId)), 'sprites : chaque combattant du joueur a un sprite de sa classe');
      const saved = session.toJSON();
      check(saved.teams.length === 1 && saved.fighters.every((f) => f.teamId === session.player.teamId) && saved.leagues.every((l) => l.teamIds.length === 18),
        'sauvegarde : clubs adverses référencés par identifiant, pas copiés');
      const [clubA] = opponents;
      const clubLeague = clubDatabase.getInitialLeagueOf(clubA.id);
      const clubAFighters = session.getFightersOfTeam(clubA.id);
      check(clubAFighters.every((f) => typeof f.score === 'number' && isValidSprite(f.specialtyId, f.spriteId)), 'clubs adverses : score et sprite de sa classe pour chaque combattant');
      check(computeFighterLevel(clubAFighters[0]) === clubAFighters[0].score, 'niveau d’un combattant adverse = son score');

      clubDatabase.updateClub(clubA.id, { name: 'Les Testeurs Adverses', emblem: 'croix', colors: { primary: '#123456' } });
      check(getStandings(session).some((r) => r.team.name === 'Les Testeurs Adverses' && r.team.emblem.patternId === 'croix'), 'admin : nom et emblème modifiés, visibles dans le classement');
      const extra = [];
      for (let i = 0; i < 4; i++) extra.push(clubDatabase.addFighter(clubA.id, { score: 5 }));
      check(session.getFightersOfTeam(clubA.id).length === 12 && extra.every((f) => isValidSprite(f.specialty, f.sprite)), 'admin : combattants ajoutés avec un sprite aléatoire de leur classe');
      const scores = [92, 87, 81, 79, 76, 72, 68, 65, 5, 5, 5, 5];
      session.getFightersOfTeam(clubA.id).forEach((f, i) => clubDatabase.updateFighter(clubA.id, f.id, { score: scores[i] }));
      const expected = (92 + 87 + 81 + 79 + 76 + 72 + 68 + 65) / 8;
      const row = getStandings(session).find((r) => r.team.id === clubA.id);
      check(Math.abs(row.level - expected) < 1e-9 && row.stars === 4, 'niveau club adverse : 8 meilleurs scores sur 12 (moyenne 77,5 → 4 étoiles)');
      const firstExtra = extra[0];
      const spriteBefore = clubDatabase.getFighter(firstExtra.id).spriteId;
      clubDatabase.updateFighter(clubA.id, firstExtra.id, { name: 'Renommé', sprite: 'runner_01', score: 150 });
      check(clubDatabase.getFighter(firstExtra.id).spriteId === spriteBefore && clubDatabase.getFighter(firstExtra.id).score === 100, 'admin : sprite non modifiable, score borné à 100');
      const classSwitch = clubDatabase.getClubData(clubA.id).fighters.find((f) => f.id === extra[1].id);
      const newClass = SPECIALTY_IDS.find((c) => c !== classSwitch.specialty);
      const variantBefore = Number(classSwitch.sprite.slice(-2));
      clubDatabase.updateFighter(clubA.id, extra[1].id, { specialty: newClass });
      const switched = clubDatabase.getClubData(clubA.id).fighters.find((f) => f.id === extra[1].id);
      check(switched.specialty === newClass && isValidSprite(newClass, switched.sprite) && Number(switched.sprite.slice(-2)) === variantBefore && isValidSprite(newClass, clubDatabase.getFighter(extra[1].id).spriteId),
        'admin : changer la spécialité d’un combattant remplace son sprite par la même variante de la nouvelle classe');
      clubDatabase.removeFighter(clubA.id, firstExtra.id);
      check(session.getFightersOfTeam(clubA.id).length === 11, 'admin : suppression d’un combattant');
      check(clubDatabase.hasLocalChanges(clubLeague), 'admin : modifications enregistrées localement');
      await clubDatabase.init(clubStorage).load();
      check(clubDatabase.getTeam(clubA.id).name === 'Les Testeurs Adverses', 'admin : modifications conservées au rechargement');
      check(JSON.parse(clubDatabase.exportLeague(clubLeague)).clubs.length === clubDatabase.getExpectedClubCount(clubLeague), 'admin : export JSON valide');
      clubDatabase.resetToFile(clubLeague);
      check(!clubDatabase.hasLocalChanges(clubLeague) && clubDatabase.getTeam(clubA.id).name === clubA.name, 'admin : retour aux données du fichier');

      // ---------- Activités ----------
      check(listActivities().map((a) => a.id).join() === 'banquet,lice,dummies,hay,forest,river', 'centre : 6 activités (Infirmerie retirée)');
      const [inf, ban, lice, dum, hay, forest, river] = session.playerFighters;
      const plan = { banquet: ban, lice, dummies: dum, hay, forest, river };
      for (const [activityId, fighter] of Object.entries(plan)) assignActivity(session, fighter.id, activityId);
      // Sauvegarde antérieure à la v0.40 : un combattant encore à l'Infirmerie passe au repos.
      inf.activityId = 'infirmary';
      check(enforceActivityCapacities(session) >= 1 && inf.activityId === null && session.playerFighters.every((f) => f.activityId === null || listActivities().some((a) => a.id === f.activityId)), 'centre : affectation à l’Infirmerie (lieu retiré) → repos au chargement');
      ban.stats.fatigue = 80;
      const before = { w: lice.stats.wrestling, p: dum.stats.polearm, c: hay.stats.percussion, e: river.stats.endurance, d: session.player.resources.deniers };
      const report = advanceDay(session, { rng: always });
      check(session.calendar.currentDay === 2, 'temps : jour 2');
      check(ban.stats.fatigue === 60, 'banquet : récupération minimale 20 (80 → 60)');
      check(lice.stats.wrestling === before.w + 1, 'petite lice : +1 Lutte');
      check(dum.stats.polearm === before.p + 1, 'mannequins : +1 Force d’arme d’hast');
      check(hay.stats.percussion === before.c + 1, 'tas de foin : +1 Percussion');
      // Jour 1 = été : la rivière est asséchée, l'affectation a été refusée (tests des saisons :
      // +1 Endurance le reste de l'année).
      check(river.activityId === null && river.stats.endurance === before.e, 'rivière : asséchée en été (jour 1) — affectation refusée, pas d’entraînement');
      check(session.player.resources.deniers === before.d + 8, 'forêt : 8 deniers au tirage minimal (plage 8 à 12, configurable)');
      ban.stats.fatigue = 80;
      advanceDay(session, { rng: never });
      check(ban.stats.fatigue === 40, 'banquet : 100 % de réussite, récupération maximale 40 (80 → 40)');
      check(DAY_PHASES.map((p) => p.id).join() === 'game-day,unplayed-matchday,unplayed-queen-combat,season-end,activities,climate-season,talent-income,studies,fighter-potential,events,ai-retirement,ai-recruitment,ai-progression,league,schedule,achievements', 'temps : GameDay → (journée ou Combat de la Reine non disputés) → fin de saison → activités → passage de saison de l’année → études du Scriptorium → événements → IA (retraites, recrutements, progression) → ligue');

      const scene = new CentreScene(session);
      const lp = scene.getPlacement(lice.id);
      check(scene.zoneAt(lp.tile.x, lp.tile.y)?.activity?.id === 'lice', 'centre : combattant placé dans la petite lice');

      // ---------- Centre : mise en scène (présentation seulement) ----------
      const { ACTIVITY_VISUALS: cvVisuals, CENTRE_AMBIENCE: cvAmbience, CLASS_ANIMATION_STYLE: cvStyles } = await import('../src/data/centreVisuals.js');
      const { FIGHTER_ANIMATIONS: cvAnims, resolveFighterAnimation: cvResolve } = await import('../src/centre/animation/fighterAnimations.js');
      const { CentreVisualController: CvController, routeBetween: cvRoute } = await import('../src/centre/CentreVisualController.js');
      const { CentreAmbience: CvAmbience } = await import('../src/centre/animation/environment.js');
      const { setVfxSetting: cvSetVfx } = await import('../src/render/vfx/vfxLevel.js');
      const { CENTRE_LAYOUT: cvLayout } = await import('../src/data/centreLayout.js');
      const inArea = (p, a) => p.x >= a.x && p.x < a.x + a.w && p.y >= a.y && p.y < a.y + a.h;
      const cvConfigOk = listActivities().every((activity) => {
        const visual = cvVisuals[activity.id];

          && points.every((p) => inArea(p, activity.area) && (p.partner === undefined || points[p.partner]?.partner === points.indexOf(p)));
      });
      check(cvConfigOk, 'centre (mise en scène) : chaque lieu a son animation et assez de places dessinées, toutes dans sa zone (partenaires de lutte réciproques)');
      const cvAnimOf = (activityId, state, fighter = { specialtyId: 'lutteur', stats: { fatigue: 0 } }) => cvResolve(fighter, activityId, state).name;
      check(['river', 'banquet', 'lice', 'dummies', 'hay', 'forest'].map((id) => cvAnimOf(id, 'active')).join() === 'swim,eat,spar,strikeDummy,chargeHay,chop'
        && cvAnimOf('river', 'walking') === 'walk' && cvAnimOf(null, 'idle') === 'idle' && cvAnimOf('infirmary', 'active') === 'idle',
        'centre (mise en scène) : animation selon l’activité et l’état (nage, repas, lutte, mannequin, charge, coupe ; marche ; repos)');
      const cvTired = cvResolve({ specialtyId: 'hastier', stats: { fatigue: 90 } }, 'lice', 'active');
      const cvFresh = cvResolve({ specialtyId: 'hastier', stats: { fatigue: 0 } }, 'lice', 'active');
      check(cvStyles.lutteur.reach > cvStyles.hastier.reach && cvTired.tempo < cvFresh.tempo && cvTired.name === cvFresh.name,
        'centre (mise en scène) : gestes selon la classe ; un combattant fatigué ralentit (même animation)');
      // Aucune image n'est figée : l'animation de repos bouge d'un instant à l'autre.
      const cvIdleA = cvAnims.idle(1, { facing: 1 }).pose;
      const cvIdleB = cvAnims.idle(1.7, { facing: 1 }).pose;
      check(cvIdleA.rotate !== cvIdleB.rotate || cvIdleA.scaleY !== cvIdleB.scaleY, 'centre (mise en scène) : animation de repos jamais figée');

      const cvGame = createRandomGame({ rng: createRng('centre-visual') });
      const [cvA, cvB, cvC] = cvGame.playerFighters;
      for (const f of cvGame.playerFighters) assignActivity(cvGame, f.id, null);
      assignActivity(cvGame, cvA.id, 'lice');
      assignActivity(cvGame, cvB.id, 'lice');
      const cvScene = new CentreScene(cvGame);
      const cvAmb = new CvAmbience(cvScene);
      const cvCtrl = new CvController(cvScene, { ambience: cvAmb });
      const cvBefore = JSON.stringify(cvGame.playerFighters.map((f) => [f.activityId, f.stats]));
      cvCtrl.update(0);
      check(cvCtrl.getActor(cvA.id).state === 'active' && cvCtrl.getActor(cvC.id).state === 'idle' && cvCtrl.getActor(cvA.id).x === cvScene.getPlacement(cvA.id).x,
        'centre (mise en scène) : à l’ouverture, chacun est à sa place (actif dans son lieu, au repos dans la cour)');
      const cvSlotB = cvScene.getPlacement(cvB.id).slot;
      // (Affectation directe : la mise en scène est indépendante de la saison ; en été, la rivière
      // asséchée refuse les affectations du service, voir les tests des saisons.)
      cvA.activityId = 'river';
      let cvT = 0;
      cvCtrl.update(cvT += 0.05);
      const cvWalking = cvCtrl.getActor(cvA.id).state === 'walking';
      const cvFirstFrame = cvCtrl.frame(cvA, cvT).animation;
      while (cvCtrl.getActor(cvA.id).state === 'walking' && cvT < 40) { cvCtrl.update(cvT += 0.05); cvCtrl.frame(cvA, cvT); }
      const cvArrived = cvCtrl.getActor(cvA.id);
      check(cvWalking && cvFirstFrame === 'walk' && cvArrived.state === 'active' && cvCtrl.frame(cvA, cvT).animation === 'swim'
        && Math.hypot(cvArrived.x - cvScene.getPlacement(cvA.id).x, cvArrived.y - cvScene.getPlacement(cvA.id).y) < 0.01 && cvT > 1,
        `centre (mise en scène) : affecté à la Rivière, il y marche (${cvT.toFixed(1)} s) puis nage`);
      check(cvScene.getPlacement(cvB.id).slot === cvSlotB, 'centre (mise en scène) : un départ ne fait pas changer de place les autres combattants du lieu');
      assignActivity(cvGame, cvA.id, null);
      cvCtrl.update(cvT += 0.05);
      const cvLeaving = cvCtrl.getActor(cvA.id).state === 'walking';
      while (cvCtrl.getActor(cvA.id).state === 'walking' && cvT < 80) cvCtrl.update(cvT += 0.05);
      check(cvLeaving && cvCtrl.getActor(cvA.id).state === 'idle', 'centre (mise en scène) : retiré de son lieu, il revient à pied dans la cour');
      check(JSON.stringify(cvGame.playerFighters.map((f) => f.stats)) === JSON.stringify(JSON.parse(cvBefore).map(([, s]) => s)),
        'centre (mise en scène) : aucune statistique modifiée par l’animation');
      // Trajet depuis le Banquet : par son entrée, jamais à travers la table.
      const cvTable = { x: 2, y: 3, w: 4, h: 1 };
      const cvPath = cvRoute({ x: 3.5, y: 2.75 }, { x: 11.5, y: 9 }, cvLayout, { exit: cvVisuals.banquet.entrance });
      const cvCrosses = [{ x: 3.5, y: 2.75 }, ...cvPath].some((p, i, all) => i > 0 && Array.from({ length: 21 }, (_, k) => ({ x: all[i - 1].x + (p.x - all[i - 1].x) * k / 20, y: all[i - 1].y + (p.y - all[i - 1].y) * k / 20 })).some((q) => inArea(q, cvTable)));
      check(cvPath[0].x === cvVisuals.banquet.entrance.x && !cvCrosses, 'centre (mise en scène) : on quitte le Banquet par son entrée, sans traverser la table');
      // Gestes : une gerbe par coup (mannequin), effets plafonnés, rien si les effets sont désactivés.
      assignActivity(cvGame, cvC.id, 'dummies');
      cvCtrl.update(cvT += 0.05);
      while (cvCtrl.getActor(cvC.id).state === 'walking' && cvT < 120) cvCtrl.update(cvT += 0.05);
      const cvBursts = [];
      const cvSpawn = cvAmb.spawn.bind(cvAmb);
      cvAmb.spawn = (id, ...rest) => { if (id === 'straw') cvBursts.push(id); return cvSpawn(id, ...rest); };
      const cvStart = cvT;
      while (cvT < cvStart + 1.35 * 4) { cvT += 0.05; cvCtrl.frame(cvC, cvT); }
      cvAmb.spawn = cvSpawn;
      check(cvBursts.length >= 2 && cvBursts.length <= 6, `centre (mise en scène) : le mannequin frappé perd sa paille une fois par coup (${cvBursts.length} gerbes en 4 coups)`);
      for (let k = 0; k < 500; k++) cvAmb.spawn('straw', { x: 12, y: 2 }, cvT);
      const cvCount = cvAmb.particles(cvT + 0.1).length;
      cvSetVfx('off');
      cvAmb.update(cvT + 0.2);
      const cvOff = cvAmb.particles(cvT + 0.2).length === 0 && cvAmb.birds(cvT).length === 0 && cvAmb.spawn('straw', { x: 12, y: 2 }, cvT) === null;
      cvSetVfx('full');
      check(cvCount > 0 && cvCount <= cvAmbience.maxParticles && cvOff, `centre (mise en scène) : particules plafonnées (${cvCount} ≤ ${cvAmbience.maxParticles}) ; effets désactivés → aucune particule ni oiseau`);
      // Oiseaux : de temps en temps seulement.
      let cvBirdTime = 0;
      for (let s = 0; s < 600; s += 1) if (cvAmb.birds(s).length) cvBirdTime++;
      check(cvBirdTime > 0 && cvBirdTime < 400, `centre (mise en scène) : oiseaux de passage de temps en temps (${cvBirdTime} s sur 600)`);

      // ---------- Plafond des compétences selon le potentiel ----------
      const { POTENTIAL_CONFIG: capConfig } = await import('../src/data/fighterProfile.js');
      const { getStatCap: capOf, isAtPotentialCap: capReached, canImproveStat: capCanImprove } = await import('../src/systems/fighters/stats.js');
      const { StatList: CapStatList } = await import('../src/ui/components/StatList.js');
      check(JSON.stringify(capConfig.skillCaps) === '{"0":55,"1":70,"2":85,"3":100}', 'plafond : 0 flamme → 55, 1 → 70, 2 → 85, 3 → 100');
      const plafGame = createRandomGame({ rng: createRng('caps') });
      const [capA, capB, capC] = plafGame.playerFighters;
      capA.potential = 0; capA.stats.wrestling = 53;
      const capGain1 = improveStat(capA, 'wrestling', 4);
      const capGain2 = improveStat(capA, 'wrestling', 4);
      check(capGain1 === 2 && capA.stats.wrestling === 55 && capGain2 === 0 && !capCanImprove(capA, 'wrestling') && capReached(capA, 'wrestling'),
        'plafond : 53 + 4 s’arrête à 55 (0 flamme), puis plus aucun gain');
      capA.potential = 3; capA.stats.polearm = 97;
      check(capOf(capA, 'polearm') === 100 && improveStat(capA, 'polearm', 4) === 3 && !capReached(capA, 'polearm'), 'plafond : 3 flammes → jusqu’à 100');
      capB.potential = 2; capB.stats.percussion = 80;
      const capBefore = improveStat(capB, 'percussion', 1);
      capB.potential = 1;
      const capAfterLoss = improveStat(capB, 'percussion', 3);
      check(capBefore === 1 && capAfterLoss === 0 && capB.stats.percussion === 81 && capReached(capB, 'percussion'),
        'plafond : une flamme perdue abaisse le plafond ; la valeur déjà acquise est conservée mais ne progresse plus');
      capB.stats.fatigue = 60;
      check(capOf(capB, 'fatigue') === 100 && capOf(capB, 'hp') === 150 && improveStat(capB, 'fatigue', 20) === 20 && capOf({ stats: {}, potential: null }, 'wrestling') === 100,
        'plafond : PV et fatigue non concernés ; combattant sans potentiel (IA) non plafonné');
      // Au Centre : un combattant au plafond est signalé, sans tirage ni gain.
      for (const f of plafGame.playerFighters) assignActivity(plafGame, f.id, null);
      capC.potential = 0; capC.stats.wrestling = 60;
      assignActivity(plafGame, capC.id, 'lice');
      const capReport = advanceDay(plafGame, { rng: always });
      const capBlocked = capReport.ofType('activity.blocked').find((e) => e.fighterId === capC.id);
      check(capBlocked?.capped === true && capBlocked.statId === 'wrestling' && capC.stats.wrestling === 60 && !capReport.ofType('activity.reward').some((e) => e.fighterId === capC.id),
        'plafond : à la Petite lice, un lutteur au plafond ne gagne rien et le carnet le signale');
      const { GROUP_FORMATS: capGroups } = await import('../src/ui/report/logbookFormats.js');
      check(capGroups.blocked([capBlocked], { session: plafGame }).text.includes('LUT au plafond de son potentiel'), 'plafond : carnet « LUT au plafond de son potentiel »');
      // Fiche : zone hachurée au-delà du plafond, aucun chiffre du plafond affiché.
      capB.potential = 1; capB.stats.wrestling = 30;
      const capView = CapStatList(capB);
      const capZones = capView.querySelectorAll('.stat-cap-zone');
      check(capZones.length === 4 && capZones[0].style.left === '70%' && capView.querySelector('.stat-row.is-capped') && !/\b70\b/.test(capView.textContent),
        'plafond (fiche) : zone hachurée sur les 4 compétences, 🔥 sur la compétence au plafond, aucun chiffre du plafond');

      // ---------- IA de combat : 5 profils et banc d'essai ----------
      const { AI_PROFILES: aiProfiles, getAIProfile } = await import('../src/data/aiProfiles.js');
      const { FIGHTER_AI_CONFIG: aiBaseConfig, AI_PLACEMENT_CONFIG: aiBasePlacement } = await import('../src/data/combatRules.js');
      const { playBenchMatch, runAIBench, createBenchRoster } = await import('../src/systems/ai/AIBenchService.js');
      const { LINEUP_STRATEGIES } = await import('../src/systems/ai/LineupStrategies.js');
      const { simulateRound: aiSimulate } = await import('../src/combat/engine/CombatManager.js');
      const { createCombatUnit: aiUnit } = await import('../src/combat/engine/CombatUnit.js');
      const classic = getAIProfile('ordonnance');
      check(aiProfiles.map((p) => p.id).join() === 'ordonnance,mur,chevauchee,marteau,usure,stratege,tacticien,chasseur'
        && classic.fighterAI === aiBaseConfig && classic.lineup === 'disciplined' && classic.placement.strategy === aiBasePlacement.strategy
        && getAIProfile('classique').id === 'ordonnance' && getAIProfile('stratege2').id === 'stratege' && getAIProfile('brouillon').id === 'chevauchee' && getAIProfile('inconnu').id === 'ordonnance',
        'IA : 8 profils (Ordonnance, Mur, Chevauchée, Marteau, Usure, Stratège, Tacticien, Chasseur de têtes) ; l’Ordonnance garde les réglages de base ; anciens profils des combats sauvegardés redirigés');
      // Chaque profil a sa signature : composition, placement, cibles, souffle.
      const aiDistinct = new Set(aiProfiles.map((p) => JSON.stringify([p.lineup, p.formation, p.placement, p.fighterAI])));
      check(aiDistinct.size === 8 && getAIProfile('mur').formation.runner === 0 && getAIProfile('chevauchee').formation.runner === 2 && getAIProfile('marteau').placement.overloadWeight > 0
        && getAIProfile('usure').lineup === 'rotation' && getAIProfile('usure').fighterAI.target.tiredWeight > 0 && getAIProfile('chasseur').fighterAI.target.captainWeight > 0
