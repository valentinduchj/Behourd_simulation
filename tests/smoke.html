        'équipes enregistrées : 3 au plus, nom de 24 caractères au plus, 8 combattants ; aucune au départ');
      check(cleanTeamNameST('  Équipe   Reine ') === 'Équipe Reine' && cleanTeamNameST('Équipe') === 'Équipe'
        && !createSavedTeamUI(stGame, '   ', stIds.slice(0, 8)).ok
        && !createSavedTeamUI(stGame, 'x'.repeat(25), stIds.slice(0, 8)).ok
        && !createSavedTeamUI(stGame, 'Sept', stIds.slice(0, 7)).ok
        && !createSavedTeamUI(stGame, 'Doublon', [...stIds.slice(0, 7), stIds[0]]).ok
        && !createSavedTeamUI(stGame, 'Inconnu', [...stIds.slice(0, 7), 'ftr_inconnu']).ok
        && listSavedTeamsUI(stGame).length === 0,
        'équipes enregistrées : nom nettoyé (espaces, accents) ; refus d’un nom vide ou trop long, de 7 combattants, d’un doublon, d’un inconnu');
      const stTeam = createSavedTeamUI(stGame, 'Équipe Reine', stIds.slice(0, 8)).team;
      const stJson = JSON.stringify(stGame.toJSON().player.savedTeams);
      check(stTeam && JSON.stringify(Object.keys(stTeam)) === '["id","name","fighterIds"]' && stJson.includes(stIds[0]) && !stJson.includes('"stats"'),
        'équipes enregistrées : seules les références des combattants sont gardées (id, nom, fighterIds)');
      const stReloaded = GameSession.fromJSON(JSON.parse(JSON.stringify(stGame.toJSON())));
      check(listSavedTeamsUI(stReloaded)[0]?.name === 'Équipe Reine' && listSavedTeamsUI(stReloaded)[0].fighterIds.join() === stIds.slice(0, 8).join(),
        'équipes enregistrées : sauvegardées et rechargées avec le club du joueur');
      // Le combattant évolue : l'équipe le référence toujours, avec ses valeurs actuelles.
      stGame.playerFighters[0].stats.fatigue = 77;
      const stLoaded = loadSavedTeamST(stGame, stTeam.id);
      check(stLoaded.complete && stLoaded.fighterIds[0] === stIds[0] && stGame.getFighter(stLoaded.fighterIds[0]).stats.fatigue === 77,
        'équipes enregistrées : un combattant qui évolue reste dans l’équipe (valeurs actuelles)');
      // Combattant parti : jamais sélectionné, équipe signalée incomplète, modifiable.
      stGame.player.savedTeams[0].fighterIds[1] = 'ftr_parti';
      const stPartial = loadSavedTeamST(stGame, stTeam.id);
      check(!stPartial.complete && stPartial.available === 7 && !stPartial.fighterIds.includes('ftr_parti') && stPartial.missing.join() === 'ftr_parti' && describeIncompleteST(stPartial) === 'Cette équipe n’est plus complète. 7 combattants disponibles sur 8.',
        'équipes enregistrées : combattant disparu ignoré ; « Cette équipe n’est plus complète. 7 combattants disponibles sur 8. »');
      check(updateSavedTeamST(stGame, stTeam.id, 'Domicile', stIds.slice(0, 8).reverse()).ok && listSavedTeamsUI(stGame)[0].name === 'Domicile' && listSavedTeamsUI(stGame)[0].id === stTeam.id,
        'équipes enregistrées : modification (nom et combattants)');
      createSavedTeamUI(stGame, 'B', stIds.slice(0, 8));
      createSavedTeamUI(stGame, 'C', stIds.slice(0, 8));
      const stFourth = createSavedTeamUI(stGame, 'D', stIds.slice(0, 8));
      const stCount = stGame.playerFighters.length;
      check(!stFourth.ok && listSavedTeamsUI(stGame).length === 3 && deleteSavedTeamST(stGame, stTeam.id) && listSavedTeamsUI(stGame).length === 2 && stGame.playerFighters.length === stCount,
        'équipes enregistrées : jamais de 4e équipe ; supprimer une équipe ne retire aucun combattant');
      // Équipe Type : les 8 plus hauts niveaux, sans contrainte de classe (effectif de 10).
      stGame.player.resources.deniers = 99999;
      for (const candidate of stGame.recruitment.candidates.slice(0, 2)) recruit(stGame, candidate.id);
      const stType = selectTypeTeamST(stGame);
      const stLevels = stGame.playerFighters.map((f) => computeFighterLevel(f)).sort((a, b) => b - a);
      check(stType.length === Math.min(8, stCount) && stType.map((id) => computeFighterLevel(stGame.getFighter(id))).sort((a, b) => b - a).join() === stLevels.slice(0, 8).join(),
        'équipe Type : les 8 combattants au plus haut niveau actuel, quelle que soit leur classe');

      // ---------- Persistance ----------
      renameFighter(session, river.id, 'Hugues le Testeur');
      recruit(session, session.recruitment.candidates[0].id);
      const storage = new StorageBackend('behourd-smoketest.');
      const saves = new SaveSystem(storage);
      saves.deleteAll();
      saves.save(session);
      const loaded = saves.load(session.saveId);
      check(JSON.stringify(loaded.toJSON()) === JSON.stringify(session.toJSON()), 'chargement : état complet identique');
      check(loaded.playerLeague?.id === 'league_3' && getStandings(loaded).length === 18 && loaded.leagues.length === 3 && loaded.season.number === 1, 'chargement : divisions, classement et saison');
      check(loaded.playerLeague.schedule.length === 17 && loaded.calendar.events.filter((e) => e.typeId === 'combat').length === 17, 'chargement : calendrier des rencontres conservé');
      check(loaded.getFighter(lice.id).activityId === 'lice' && loaded.getFighter(river.id).name === 'Hugues le Testeur', 'chargement : affectations et noms');
      check(loaded.calendar.currentDay === 3 && loaded.player.resources.deniers === session.player.resources.deniers, 'chargement : date et deniers');
      check(saves.listSaves()[0].leagueName === 'Ligue 3' && saves.listSaves()[0].season === 1, 'sauvegarde : ligue et saison dans le résumé');
      check(loaded.playerFighters.every((f) => f.spriteId === session.getFighter(f.id).spriteId), 'chargement : sprites conservés à l’identique');

      // Migration d'une sauvegarde v3 (clubs IA copiés, apparence générée, pas de sprite).
      const v3 = {
        formatVersion: 3, gameVersion: '0.3.0',
        meta: { teamName: 'Joueur', fighterCount: 1, savedAt: 1, day: 4 },
        data: {
          player: { id: 'p1', teamId: 't1', resources: { deniers: 77 } },
          teams: [
            { id: 't1', name: 'Joueur', ownerId: 'p1', leagueId: 'L1', fighterIds: ['f1'], emblem: {} },
            { id: 'ai1', name: 'Ancien club IA', ownerId: null, leagueId: 'L1', fighterIds: ['g1'], emblem: {} },
          ],
          fighters: [
            { id: 'f1', teamId: 't1', name: 'Raoul', specialtyId: 'runner', appearance: { skinTone: 'pale' }, stats: { hp: 80, wrestling: 30 }, activityId: 'lice' },
            { id: 'g1', teamId: 'ai1', name: 'Fantôme', specialtyId: 'lutteur', stats: {} },
          ],
          calendar: { currentDay: 4, scheduledThrough: 32, events: [] },
          recruitment: { generatedOnDay: 1, candidates: [] },
          leagues: [{ id: 'L1', definitionId: 'fr-2', teamIds: ['t1', 'ai1'], standings: {} }],
        },
      };
      storage.writeJSON('save.v3', v3);
      const m3 = saves.load('v3');
      const m3bis = saves.load('v3');
      check(!m3.getTeam('ai1') && !m3.getFighter('g1') && m3.playerLeague.teamIds.length === 18 && m3.leagues.length === 3, 'migration v3 → v4 : clubs IA remplacés par ceux des fichiers');
      check(!('appearance' in m3.getFighter('f1').toJSON()) && m3.getFighter('f1').stats.wrestling === 30 && m3.getFighter('f1').activityId === 'lice', 'migration v3 → v4 : combattant conservé, apparence retirée');
      check(isValidSprite('runner', m3.getFighter('f1').spriteId) && m3.getFighter('f1').spriteId === m3bis.getFighter('f1').spriteId, 'migration v3 → v4 : sprite de sa classe attribué et stable entre deux chargements');

      // Migration d'une sauvegarde v2 (spécialité « runer », anciennes stats, ancien Pôle Combat).
      const v2 = {
        formatVersion: 2, gameVersion: '0.2.0',
        meta: { teamName: 'Anciens', fighterCount: 1, savedAt: 1, day: 7 },
        data: {
          player: { id: 'p1', teamId: 't1', resources: { deniers: 42 } },
          teams: [{ id: 't1', name: 'Anciens', fighterIds: ['f1'], emblem: { colors: { primary: 'azur' } } }],
          fighters: [{ id: 'f1', teamId: 't1', name: 'Raoul', specialtyId: 'runer', stats: { hp: 70, strength: 14, speed: 12 }, activityId: 'training' }],
          calendar: { currentDay: 7, scheduledThrough: 35, events: [] },
          recruitment: { generatedOnDay: 1, candidates: [{ id: 'r1', cost: 60, fighter: { id: 'f2', name: 'Eudes', specialtyId: 'runer', stats: { hp: 100 } } }] },
        },
      };
      storage.writeJSON('save.ancienne', v2);
      const migrated = saves.load('ancienne');
      const old = migrated.getFighter('f1');
      check(old.specialtyId === 'runner' && old.specialty.name === 'Runner', 'migration v2 → v3 : runer devient runner');
      check(migrated.recruitment.candidates[0].fighter.specialtyId === 'runner', 'migration v2 → v3 : recrues de la Taverne aussi');
      check(old.stats.hp === 105 && !('strength' in old.stats) && old.stats.wrestling === 25 && old.activityId === null, 'migration v2 → v3 : stats et activité');
      check(migrated.playerLeague?.teamIds.length === 18 && migrated.calendar.currentDay === 7, 'migration v2 → v3 : ligue créée, date conservée');
      {
        const { migrateSave } = await import('../src/systems/save/migrations.js');
        const v7 = migrateSave({ formatVersion: 7, data: {
          fighters: [{ id: 'a', stats: { hp: 100, fatigue: 30 } }, { id: 'b', stats: { hp: 41 } }, { id: 'c', stats: {} }],
          recruitment: { candidates: [{ id: 'r', fighter: { id: 'd', stats: { hp: 100 } } }] },
        } });
        const [ha, hb, hc] = v7.data.fighters;
        check(v7.formatVersion === 8 && ha.stats.hp === 150 && ha.stats.fatigue === 30 && hb.stats.hp === 62 && !('hp' in hc.stats) && v7.data.recruitment.candidates[0].fighter.stats.hp === 150,
          'migration v7 → v8 : PV × 1,5 (100 → 150, 41 → 62), fatigue intacte, recrues de la Taverne aussi');
      }

      // Migration d'une sauvegarde v6 : ancienne « Ligue 2 » à 20 équipes, saison en cours.
      // (les 19 clubs de l'ancienne Ligue 2 : 18 sont restés en league_2.json, 1 est passé en réserve)
      const legacyClubs = [...clubDatabase.getClubIdsOfLeague('league_2'), clubDatabase.getClubIdsOfLeague('reserve').find((id) => id.startsWith('club_0'))];
      const legacyStandings = Object.fromEntries(['t1', ...legacyClubs].map((id, i) => [id, { played: 2, wins: i % 2 ? 1 : 2, losses: i % 2 ? 1 : 0, roundsWon: 3, roundsLost: 2, points: i === 0 ? 6 : 3 }]));
      const v6 = {
        formatVersion: 6, gameVersion: '0.6.0',
        meta: { teamName: 'Héritiers', fighterCount: 1, savedAt: 1, day: 12 },
        data: {
          player: { id: 'p1', teamId: 't1', resources: { deniers: 55 } },
          teams: [{ id: 't1', name: 'Héritiers', ownerId: 'p1', leagueId: 'oldL', fighterIds: ['f1'], emblem: {} }],
          fighters: [{ id: 'f1', teamId: 't1', name: 'Raoul', specialtyId: 'runner', stats: { wrestling: 30 } }],
          calendar: { currentDay: 12, scheduledThrough: 40, events: [
            { id: 'e1', typeId: 'combat', day: 4, status: 'done', data: { matchday: 1 } },
            { id: 'e2', typeId: 'combat', day: 9, status: 'done', data: { matchday: 2 } },
            { id: 'e3', typeId: 'combat', day: 14, status: 'scheduled', data: { matchday: 3 } },
          ] },
          recruitment: { generatedOnDay: 1, candidates: [] },
          leagues: [{ id: 'oldL', definitionId: 'fr-2', teamIds: ['t1', ...legacyClubs], standings: legacyStandings }],
        },
      };
      storage.writeJSON('save.v6', v6);
      const m6 = saves.load('v6');
      check(m6.playerLeague?.id === 'league_2' && m6.playerLeague.teamIds.length === 20 && m6.getTeam('t1').leagueId === 'league_2', 'migration v6 → v7 : le joueur reste en Ligue 2, saison en cours conservée');
      check(getStandings(m6).find((r) => r.isPlayer).points === 6 && m6.playerLeague.roundsPlayed === 2, 'migration v6 → v7 : classement et journées disputées conservés');
      check(m6.leagues.length === 3 && m6.calendar.events.filter((e) => e.typeId === 'combat' && e.status === 'scheduled').length === 17 && m6.calendar.events.filter((e) => e.typeId === 'combat' && e.status === 'scheduled')[0].day >= 14 && m6.calendar.events.filter((e) => e.typeId === 'combat' && e.status === 'scheduled')[0].day <= 16, 'migration v6 → v7 : 3 divisions, 17 journées restantes, la première 4 à 6 jours après le dernier combat (jour 9)');
      m6.playerFighters.forEach((f) => Object.assign(f.stats, { wrestling: 100, polearm: 100, percussion: 100, endurance: 100 }));
      while (!isOffSeason(m6) && m6.calendar.currentDay < 200) advanceDay(m6, { rng: createRng('heritage') });
      startNextSeason(m6, createRng('heritage2'));
      check(m6.season.number === 2 && m6.leagues.every((l) => l.teamIds.length === 18 && l.schedule.length === 17) && new Set(m6.leagues.flatMap((l) => l.teamIds)).size === 54, 'saison héritée : à sa fin, divisions ramenées à 18 équipes et calendrier de 17 journées');
      check(m6.seasonHistory[0].movements.filter((m) => m.ruleId === 'withdrawal').length === 1 && m6.leagues.flatMap((l) => l.teamIds).includes('t1'), 'saison héritée : le club en surplus quitte le championnat par le bas, jamais le joueur');
      check(m6.playerLeague.id === 'league_1' && m6.seasonHistory[0].player.leagueId === 'league_2', 'saison héritée : un joueur bien classé monte en Ligue 1');
      saves.deleteAll();

      // ---------- Capacité des zones du Pôle Combat ----------
      const cap = createRandomGame({ rng: createRng('capacite') });
      const capFighters = cap.playerFighters;
      const capResults = capFighters.slice(0, 5).map((f) => assignActivity(cap, f.id, 'lice'));
      check(capResults.slice(0, 4).every((r) => r.ok) && !capResults[4].ok, 'capacité : la petite lice refuse un 5e combattant');
      check(['lice', 'dummies', 'hay'].every((id) => listActivities().find((a) => a.id === id).capacity === 4), 'capacité : 4 places pour lice, mannequins, foin (donnée de l’activité)');

      // ---------- Moteur de combat ----------
      check(Math.abs(calculateWinProbability(20, 30) - 0.32) < 1e-9 && Math.abs(calculateWinProbability(45, 40) - 0.59) < 1e-9 && calculateWinProbability(40, 40) === 0.5
        && calculateWinProbability(10, 37) > 0 && calculateWinProbability(10, 38) === 0, 'probabilité : 50 % ± 1,8 % par point d’écart (20 contre 30 → 32 % ; nulle vers 28 points)');
      check(calculateWinProbability(100, 10) === 1 && calculateWinProbability(0, 90) === 0, 'probabilité : bornée entre 0 et 100 %');
      check(computeMatchPoints(true, 2) === 3 && computeMatchPoints(false, 1) === 1 && computeMatchPoints(false, 0) === 0, 'points : victoire 3, défaite avec une manche 1, sinon 0');

      const fx = getFixtures(cap.playerLeague, 1);
      check(fx.length === 9 && new Set(fx.flatMap((f) => [f.teamAId, f.teamBId])).size === 18, 'calendrier des rencontres : 9 combats par journée, aucune équipe au repos');
      const pairs = new Set();
      for (let m = 1; m <= 17; m++) for (const f of getFixtures(cap.playerLeague, m)) pairs.add([f.teamAId, f.teamBId].sort().join('|'));
      check(pairs.size === 153 && !getFixtures(cap.playerLeague, 18), 'calendrier des rencontres : en 17 journées, chaque club affronte les 17 autres une seule fois ; pas de journée 18');

      const arena = createArena();
      // Adversaire le plus faible : la probabilité de victoire du joueur reste > 0.
      const oppId = getStandings(cap).filter((r) => !r.isPlayer).sort((a, b) => a.level - b.level)[0].team.id;
      const m1 = createMatch({ teamAId: cap.player.teamId, teamBId: oppId });
      capFighters.forEach((f) => { f.stats.fatigue = 30; });
      const lineA = capFighters.slice(0, 5).map((f) => f.id);
      const lineB = cap.getFightersOfTeam(oppId).slice(0, 5).map((f) => f.id);
      const r1 = resolveRound(cap, m1, { fightersA: lineA, fightersB: lineB }, () => 0);
      const winnerGains = r1.fatigueApplied.filter((e) => e.side === 'A').map((e) => e.amount);
      const loserGains = r1.fatigueApplied.filter((e) => e.side === 'B').map((e) => e.amount);
      check(r1.winner === 'A' && m1.scoreA === 1 && winnerGains.every((a) => a === 20) && loserGains.every((a) => a === 50), 'manche : fatigue vainqueurs +20 à 50, vaincus +50 à 60');
      check(capFighters[0].stats.fatigue === 50 && cap.getFighter(lineB[0]).stats.fatigue === 0, 'manche : fatigue appliquée au joueur, celle de l’IA suivie dans le combat seulement');
      const r2 = resolveRound(cap, m1, { fightersA: lineA, fightersB: lineB }, () => 0.9999);
      check(r2.winner === 'B' && m1.scoreA === 1 && m1.scoreB === 1 && !m1.isFinished, 'manche 2 : 1 – 1, combat pas terminé');
      check(r2.fatigueApplied.filter((e) => e.side === 'A').every((e) => e.after === 100), 'fatigue : jamais au-dessus de 100');
      resolveRound(cap, m1, { fightersA: lineA, fightersB: lineB }, () => 0);
      check(m1.isFinished && m1.winnerId === cap.player.teamId && m1.rounds.length === 3, 'manche 3 décisive : premier à 2 manches');
      const sim = simulateMatch(cap, { teamAId: oppId, teamBId: cap.playerLeague.teamIds[5] }, arena, createRng('ia'));
      check(sim.isFinished && sim.rounds.length >= 2 && sim.rounds.every((r) => r.fightersTeamA.length === 5 && r.fatigueApplied.length === 10), 'combats IA : même moteur, sélection et placement automatiques');

      // ---------- La Lice : grille 13 × 8 ----------
      check(arena.width === 13 && arena.height === 8 && arena.isInside(12, 7) && !arena.isInside(12, 8) && !arena.isInside(13, 0), 'La Lice : grille de 13 × 8 cases');
      const sideTiles = [0, 1].map((side) => arena.getDefaultTiles(side, 8));
      check(sideTiles.every((tiles, side) => tiles.every((t) => arena.isInside(t.x, t.y) && arena.isInDeploymentArea(side, t.x, t.y)) && new Set(tiles.map((t) => `${t.x},${t.y}`)).size === 8), 'La Lice : 8 emplacements distincts par camp, dans sa zone');
      check(!sideTiles[0].some((t) => arena.isInDeploymentArea(1, t.x, t.y)) && [0, 1].every((s) => { const a = arena.getSide(s).area; return a.x >= 0 && a.y >= 0 && a.x + a.w <= 13 && a.y + a.h <= 8; }), 'La Lice : zones de placement distinctes et dans la grille');
      const autoPlaced = autoPlacements(arena, 1, cap.getFightersOfTeam(oppId).slice(0, 5));
      check(autoPlaced.length === 5 && autoPlaced.every((p) => arena.isInDeploymentArea(1, p.x, p.y)), 'La Lice : placement automatique sur la nouvelle grille');

      // ---------- Décors (présentation) ----------
      check(LICE_DECORATIONS.length >= 5 && ['lice_forest', 'lice_sand', 'lice_village'].every((id) => LICE_DECORATIONS.some((d) => d.id === id)), 'décors : forêt, sable, village et 2 autres');
      const sceneryOk = LICE_DECORATIONS.every((decoration) => {
        const scenery = buildLiceScenery(arena, decoration);
        const band = decoration.layout.crowdBand;
        return scenery.width === 13 + scenery.offset.x * 2 && scenery.height === 8 + scenery.offset.y * 2 && scenery.props.length > 0
          && scenery.props.every((p) => {
            const lx = p.x - scenery.offset.x;
            const ly = p.y - scenery.offset.y;
            const w = p.w ?? 1;
            const hh = p.h ?? 1;
            // Aucun décor sur le terrain ni dans la bande des spectateurs.
            return lx + w <= -band || ly + hh <= -band || lx >= 13 + band || ly >= 8 + band;
          });
      });
      check(sceneryOk, 'décors : aucun élément sur La Lice ni dans la bande des spectateurs');
      const tallTypes = new Set(['building', 'tent', 'rampart', 'tree', 'stall', 'banner']);
      check(LICE_DECORATIONS.filter((d) => d.id !== 'lice_forest').every((d) => buildLiceScenery(arena, d).props.filter((p) => p.zone === 'front').every((p) => !tallTypes.has(p.type))), 'décors : côtés avant sans élément haut (lisibilité)');
      check(JSON.stringify(buildLiceScenery(arena, LICE_DECORATIONS[2])) === JSON.stringify(buildLiceScenery(arena, LICE_DECORATIONS[2])), 'décors : disposition stable');
      // Lice des Combats de la Reine : décor réservé, herbe, chemin pavé, remparts sobres.
      const { chooseLiceDecoration } = await import('../src/combat/presentation/LicePresentation.js');
      const { getLiceDecoration } = await import('../src/data/liceDecorations.js');
      const { QUEEN_COMBAT_CONFIG } = await import('../src/data/queenCombat.js');
      const queenDecor = getLiceDecoration(QUEEN_COMBAT_CONFIG.arenaDecorationId);
      const ordinaryPicks = new Set(Array.from({ length: 300 }, (_, i) => chooseLiceDecoration(`combat-${i}`).id));
      check(queenDecor.id === 'lice_queen' && queenDecor.exclusiveTo === 'queen' && !ordinaryPicks.has('lice_queen') && ordinaryPicks.size >= 5, 'lice de la Reine : réservée aux Combats de la Reine, jamais tirée pour les autres combats');
      const queenScenery = buildLiceScenery(arena, queenDecor);
      const pathCells = [];
      for (let y = 0; y < queenScenery.height; y++) for (let x = 0; x < queenScenery.width; x++) if (queenScenery.isPath(x, y)) pathCells.push([x, y]);
      check(pathCells.length === queenScenery.width * 2 && pathCells.every(([, y]) => y - queenScenery.border >= 8 + 2) && !queenScenery.props.some((p) => queenScenery.isPath(p.x, p.y)) && queenDecor.ground.path.style === 'cobble',
        'lice de la Reine : chemin pavé le long d’un grand côté, sans décor dessus');
      check(/^#[89][0-9a-f]c0/.test(queenDecor.ground.arena.colors[0]) && queenScenery.props.some((p) => p.type === 'rampart') && queenScenery.props.some((p) => p.type === 'tower') && queenScenery.props.filter((p) => p.zone === 'front').every((p) => !['rampart', 'tower', 'building'].includes(p.type)),
        'lice de la Reine : terrain d’herbe, remparts et tours en arrière-plan, rien de haut devant');

      // ---------- Affluence (CrowdService) ----------
      const l3 = { tier: 3, size: 18 };
      const l2 = { tier: 2, size: 18 };
      const l1 = { tier: 1, size: 18 };
      const crowd = (a, b, league) => calculateCrowdSize({ rank: a }, { rank: b }, league);
      check(crowd(18, 16, l3) <= 3, `affluence L3 : 18e contre 16e → ${crowd(18, 16, l3)} (0 à quelques spectateurs)`);
      check(crowd(11, 6, l3) >= 10 && crowd(11, 6, l3) <= 15, `affluence L3 : 11e contre 6e → ${crowd(11, 6, l3)} (10 à 15)`);
      check(crowd(2, 1, l3) === 40, `affluence L3 : 2e contre 1er → ${crowd(2, 1, l3)} (40)`);
      const pairsToCompare = [[18, 16], [11, 6], [2, 1], [9, 9], [17, 1]];
      check(pairsToCompare.every(([a, b]) => crowd(a, b, l1) > crowd(a, b, l2) && crowd(a, b, l2) > crowd(a, b, l3)), 'affluence : Ligue 1 > Ligue 2 > Ligue 3 à classement égal');
      check(crowd(1, 2, l3) === crowd(2, 1, l3) && crowd(18, 17, l3) <= crowd(10, 9, l3) && crowd(10, 9, l3) <= crowd(2, 1, l3), 'affluence : croît avec le classement des deux clubs');
      const varied = Array.from({ length: 30 }, (_, i) => calculateCrowdSize({ rank: 11 }, { rank: 6 }, l3, { rng: createRng(`v${i}`) }));
      check(new Set(varied).size > 1 && varied.every((n) => n >= 10 && n <= 15), 'affluence : légère variation aléatoire, dans la fourchette');
      const shared = getSharedRanks(getStandings(cap));
      check([...shared.values()].every((rank) => rank === 9.5), 'affluence : en début de saison, clubs ex aequo au rang moyen');
      check(Number.isInteger(getMatchCrowdSize(cap, { teamAId: cap.player.teamId, teamBId: oppId })), 'affluence : calculée depuis le classement actuel');

      // ---------- Foule (présentation) ----------
      const crowd40 = generateCrowd({ arena, count: 40, seed: 'test' });
      check(crowd40.length === 40 && crowd40.every((s) => zoneOf(arena, s.x, s.y) !== 'arena'), 'foule : 40 spectateurs, aucun dans La Lice');
      const band = LICE_DECORATIONS[0].layout.crowdBand;
      check(crowd40.every((s) => s.x > -band && s.y > -band && s.x < 13 + band && s.y < 8 + band), 'foule : contre la palissade, dans la bande prévue');
      check(crowd40.every((s) => (s.view === 'back') === (s.side === 'south' || s.side === 'east')), 'foule : tournée vers La Lice (de face derrière, de dos devant)');
      check(crowd40.filter((s) => s.side === 'north' || s.side === 'south').length > crowd40.length * 0.6, 'foule : surtout le long des grands côtés');
      check(new Set(crowd40.map((s) => s.spriteId)).size >= 8 && crowd40.every((s) => SPECTATOR_SPRITES.some((sp) => sp.id === s.spriteId)), 'foule : sprites variés parmi les 11');
      const otherCrowd = generateCrowd({ arena, count: 40, seed: 'autre' });
      check(crowd40.map((s) => s.spriteId).join() !== otherCrowd.map((s) => s.spriteId).join() && JSON.stringify(generateCrowd({ arena, count: 40, seed: 'test' })) === JSON.stringify(crowd40), 'foule : tirage différent d’un combat à l’autre, stable pour un même combat');
      const minGap = (list) => Math.min(...list.flatMap((a, i) => list.slice(i + 1).map((b) => Math.hypot(a.x - b.x, a.y - b.y))));
      check(minGap(generateCrowd({ arena, count: 110, seed: 'max' })) > 0.2, 'foule : pas de superposition excessive');
      check(generateCrowd({ arena, count: 500, seed: 'x' }).length === Math.min(CROWD_LAYOUT.maxRendered, listCrowdSlots(arena).length) && generateCrowd({ arena, count: 0, seed: 'x' }).length === 0, 'foule : plafonnée pour rester fluide ; aucune si affluence nulle');
      const beforePresentation = JSON.stringify(cap.toJSON());
      const presentation = buildLicePresentation(cap, { arena, teamAId: cap.player.teamId, teamBId: oppId, matchday: 1 });
      check(presentation.crowd.length === Math.min(presentation.crowdSize, CROWD_LAYOUT.maxRendered) && JSON.stringify(cap.toJSON()) === beforePresentation, 'présentation : décor et foule sans effet sur la partie');

      // ---------- Journée de combat ----------
      const cd = createRandomGame({ rng: createRng('journee') });
      while (!getPendingMatchdayEvent(cd)) advanceDay(cd, { rng: never });
      check(cd.calendar.currentDay === 4 && isCombatDay(cd.calendar), 'calendrier : le jour 4 est une journée de championnat');
      const cdFighter = cd.playerFighters[0];
      check(!assignActivity(cd, cdFighter.id, 'forest').ok, 'journée de combat : affectation au Centre refusée');
      const event = getPendingMatchdayEvent(cd);
      const playerMatch = createPlayerMatch(cd, event);
      const squad = cd.playerFighters.slice(0, 8).map((f) => f.id);
      while (!playerMatch.isFinished) {
        const lineB2 = cd.getFightersOfTeam(playerMatch.teamBId).slice(0, 5).map((f) => f.id);
        resolveRound(cd, playerMatch, { fightersA: squad.slice(0, 5), fightersB: lineB2 });
      }
      const dayResults = completeMatchday(cd, event, playerMatch);
      const rows = getStandings(cd);
      check(dayResults.length === 27 && cd.leagues.every((l) => l.roundsPlayed === 1), 'journée : 27 combats disputés dans les 3 divisions');
      check(rows.length === 18 && rows.every((r) => r.played === 1) && rows.find((r) => r.isPlayer).played === 1, 'journée : les 18 équipes de Ligue 3 ont combattu');
      const totalPoints = rows.reduce((s, r) => s + r.points, 0);
      const expectedPoints = dayResults.filter((r) => r.leagueId === cd.playerLeague.id).reduce((s, { match }) => s + 3 + (Math.min(match.scoreA, match.scoreB) > 0 ? 1 : 0), 0);
      check(totalPoints === expectedPoints && rows.every((r, i) => i === 0 || rows[i - 1].points >= r.points), 'classement : points attribués et clubs triés');
      const fatigueBefore = cd.playerFighters.map((f) => f.stats.fatigue).join();
      const dayAfter = advanceDay(cd, { rng: always });
      check(cd.calendar.currentDay === 5 && dayAfter.ofType('centre.closed').length === 1 && dayAfter.ofType('activity.reward').length === 0, 'après le combat : jour suivant, aucune activité résolue');
      check(cd.playerFighters.map((f) => f.stats.fatigue).join() === fatigueBefore, 'après le combat : la fatigue des manches est conservée');
      while (!getPendingMatchdayEvent(cd)) advanceDay(cd, { rng: never });
      advanceDay(cd, { rng: never });
      check(cd.leagues.every((l) => l.roundsPlayed === 2) && getStandings(cd).find((r) => r.isPlayer).played === 2, 'journée sautée (avance rapide) : disputée automatiquement');

      // ---------- Calendrier : espacement des journées, Combats de la Reine ----------
      const cal = createRandomGame({ rng: createRng('calendrier') });
      const champDays = cal.calendar.events.filter((e) => e.typeId === 'combat').map((e) => e.day).sort((a, b) => a - b);
      const gaps = champDays.slice(1).map((d, i) => d - champDays[i] - 1);
      check(champDays.length === 17 && champDays[0] === 4 && gaps.every((g) => g >= 4 && g <= 6), `championnat : 4 à 6 jours entre deux combats (${[...new Set(gaps)].sort().join(', ')})`);
      check(new Set(gaps).size > 1, 'championnat : écarts tirés au hasard, pas constants');
      check(generateChampionshipDates(3, 4, SEASON_CONFIG.daysBetweenMatches, () => 0).join() === '4,9,14' && generateChampionshipDates(3, 4, SEASON_CONFIG.daysBetweenMatches, () => 0.9999).join() === '4,11,18', 'championnat : écart minimal 4, maximal 6');
      const calReloaded = new SaveSystem(new StorageBackend('behourd-smoketest-cal.'));
      calReloaded.deleteAll();
      calReloaded.save(cal);
      const calCopy = calReloaded.load(cal.saveId);
      check(JSON.stringify(calCopy.calendar.toJSON()) === JSON.stringify(cal.calendar.toJSON()), 'calendrier : dates enregistrées, aucun nouveau tirage au chargement');
      calReloaded.deleteAll();
      const queenEvents = (s) => s.calendar.events.filter((e) => e.typeId === 'queen');
      const firstQueen = queenEvents(cal)[0];
      check(queenEvents(cal).length === 1 && firstQueen.status === 'scheduled' && firstQueen.day >= 16 && !champDays.includes(firstQueen.day), `Reine : un premier Combat de la Reine planifié (jour ${firstQueen.day}), jamais un jour de championnat`);
      check(getEventType('queen').color !== getEventType('combat').color && getEventType('queen').label === 'Combat de la Reine', 'Reine : type d’événement distinct (couleur orange en présentation)');
      const timeline = getTimelineEvents(cal.calendar, { from: 1, to: 60 });
      check(timeline.every((e, i) => i === 0 || timeline[i - 1].day <= e.day) && timeline.some((e) => e.typeId === 'queen') && timeline.some((e) => e.typeId === 'combat'), 'timeline : championnat et Reine mêlés, ordre chronologique');
      // Conflit : une Reine placée un jour de championnat est décalée au jour libre suivant.
      firstQueen.day = champDays[3];
      resolveCombatDayConflicts(cal.calendar);
      check(firstQueen.day > champDays[3] && !champDays.includes(firstQueen.day), 'calendrier : deux combats ne partagent jamais une journée');

      // Propositions d'adversaires.
      const opts = generateOpponentOptions(cal, createRng('opts'));
      const leagueIdsOf = (s, id) => s.leagues.find((l) => l.teamIds.includes(id))?.id ?? 'reserve';
      check(opts.length === 5 && new Set(opts.map((o) => o.teamId)).size === 5 && !opts.some((o) => o.teamId === cal.player.teamId), 'Reine : 5 adversaires distincts proposés (jamais le joueur)');
      check(opts.every((o, i) => i === 0 || opts[i - 1].stars <= o.stars), `Reine : adversaires classés du moins au plus étoilé (${opts.map((o) => o.stars).join(' ≤ ')})`);
      const tie = [{ id: 'a', stars: 2 }, { id: 'b', stars: 1 }, { id: 'c', stars: 2 }, { id: 'd', stars: 0.5 }];
      check(sortOptionsByStars(tie).map((o) => o.id).join() === 'd,b,a,c', 'Reine : tri croissant, ordre du tirage conservé à égalité');
      const fixedFactor = () => 0.5; // variation nulle
      check(calculateReward(1, fixedFactor, { ...QUEEN_COMBAT_CONFIG, rewardsByStars: { 1: 8 } }) === 16 && calculateReward(5, fixedFactor, { ...QUEEN_COMBAT_CONFIG, rewardsByStars: { 5: 410 } }) === 820
        && calculateReward(4, fixedFactor) === 300 && calculateReward(4, fixedFactor, { ...QUEEN_COMBAT_CONFIG, rewardMultiplier: 1 }) === 150, 'Reine : gains × 2 (8 → 16, 410 → 820), multiplicateur configurable');
      check(opts.every((o) => leagueIdsOf(cal, o.teamId) === o.pool), 'Reine : ligue de chaque proposition cohérente (ou hors championnat)');
      check(opts.every((o) => o.stars === getClubStars(cal, o.teamId) && o.reward % 2 === 0 && o.reward >= Math.round(getBaseReward(o.stars) * 0.85) * 2 && o.reward <= Math.round(getBaseReward(o.stars) * 1.15) * 2), 'Reine : récompense = (barème des étoiles ± 15 %) × 2');
      check([1, 2, 3, 4, 5].map((s) => getBaseReward(s)).join() === '10,30,60,150,450' && getBaseReward(0) === 10, 'Reine : barème 10 / 30 / 60 / 150 / 450 deniers');
      const poolCounts = {};
      const drawRng = createRng('tirages');
      for (let i = 0; i < 800; i++) for (const o of generateOpponentOptions(cal, drawRng)) poolCounts[o.pool] = (poolCounts[o.pool] ?? 0) + 1;
      const totalDraws = Object.values(poolCounts).reduce((a, b) => a + b, 0);
      const share = (pool) => (poolCounts[pool] ?? 0) / totalDraws;
      check(Math.abs(share('reserve') - 0.5) < 0.04 && Math.abs(share('league_2') - 0.2) < 0.03 && Math.abs(share('league_3') - 0.2) < 0.03 && Math.abs(share('league_1') - 0.1) < 0.03,
        `Reine : origines ≈ 50 / 20 / 20 / 10 % (${['reserve', 'league_2', 'league_3', 'league_1'].map((p) => Math.round(share(p) * 100)).join(' / ')})`);
      check(getOpponentPool(cal, 'reserve').every((id) => !cal.leagues.some((l) => l.teamIds.includes(id))), 'hors championnat : aucun club engagé dans une division');

      // Jour J du Combat de la Reine (avance du temps).
      const qs = createRandomGame({ rng: createRng('reine') });
      const qEvent = queenEvents(qs)[0];
      while (qs.calendar.currentDay < qEvent.day) advanceDay(qs, { rng: never });
      check(getPendingQueenEvent(qs.calendar) === qEvent && qEvent.data.options?.length === 5 && qEvent.data.stage === 'choosing' && isCombatDay(qs.calendar), 'Reine : le jour venu, 5 propositions enregistrées ; journée de combat');
      const optionsBefore = JSON.stringify(qEvent.data.options);
      generateQueenCombat(qs, qEvent, createRng('autre'));
      check(JSON.stringify(qEvent.data.options) === optionsBefore, 'Reine : propositions tirées une seule fois');
      // Autres Combats de la Reine (IA contre IA).
      const secondary = qEvent.data.secondaryMatches ?? [];
      const secondaryIds = secondary.flatMap((m) => [m.teamAId, m.teamBId]);
      const optionIds = qEvent.data.options.map((o) => o.teamId);
      check(secondary.length === 4 && secondaryIds.length === 8 && new Set(secondaryIds).size === 8, 'Reine : 4 combats secondaires, 8 clubs tous différents');
      check(secondaryIds.every((id) => !optionIds.includes(id) && id !== qs.player.teamId), 'Reine : aucun adversaire proposé (ni le joueur) dans les combats secondaires');
      check(new Set([...optionIds, ...secondaryIds]).size === 13 && validateQueenDraw(qEvent.data.options, secondary).length === 0, 'Reine : 13 clubs mobilisés (5 + 8), contrôle d’intégrité valide');
      check(secondary.every((m) => m.result === null) && JSON.stringify(secondary) === JSON.stringify(generateQueenCombat(qs, qEvent, createRng('x')) && qEvent.data.secondaryMatches), 'Reine : combats secondaires tirés une seule fois, sans résultat avant le combat');
      const badDraw = [{ teamAId: optionIds[0], teamBId: secondaryIds[1] }, ...secondary.slice(1)];
      check(validateQueenDraw(qEvent.data.options, badDraw).some((p) => p.includes('adversaire proposé')) && validateQueenDraw(qEvent.data.options, secondary.slice(1)).length > 0, 'Reine : le contrôle d’intégrité détecte doublon et combat manquant');
      const eligible = getEligibleClubIds(qs);
      const pairOrigins = new Set();
      let excludedSeen = false;
      const pairRng = createRng('paires');
      for (let i = 0; i < 300; i++) {
        for (const m of generateSecondaryMatches(qs, optionIds, pairRng)) {
          if (optionIds.includes(m.teamAId) || optionIds.includes(m.teamBId)) excludedSeen = true;
          pairOrigins.add([leagueIdsOf(qs, m.teamAId), leagueIdsOf(qs, m.teamBId)].sort().join('-'));
        }
      }
      check(!excludedSeen && eligible.length === new Set(eligible).size && eligible.some((id) => leagueIdsOf(qs, id) === 'reserve') && ['league_1', 'league_2', 'league_3'].every((l) => eligible.some((id) => leagueIdsOf(qs, id) === l)), 'Reine : tirage parmi tous les clubs éligibles (3 ligues et hors championnat), exclusion respectée');
      check(pairOrigins.has('league_1-league_3') && pairOrigins.has('reserve-reserve') && pairOrigins.has('league_1-reserve') && pairOrigins.has('league_1-league_2'), `Reine : affrontements inter-ligues possibles (${pairOrigins.size} combinaisons observées)`);
      let refused = false;
      try { selectOpponent(qs, qEvent, 'club_inconnu'); } catch { refused = true; }
      check(refused, 'Reine : impossible de choisir un club non proposé');
      const qChoice = qEvent.data.options[0];
      selectOpponent(qs, qEvent, qChoice.teamId);
      refused = false;
      try { selectOpponent(qs, qEvent, qEvent.data.options[1].teamId); } catch { refused = true; }
      check(refused && qEvent.data.selectedTeamId === qChoice.teamId, 'Reine : choix définitif, un seul adversaire');
      const leaguesBefore = JSON.stringify(qs.leagues.map((l) => l.toJSON()));
      const deniersBefore = getDeniers(qs);
      const qMatch = createQueenMatch(qs, qEvent);
      const qSquad = qs.playerFighters.slice(0, 5).map((f) => f.id);
      qs.playerFighters.forEach((f) => Object.assign(f.stats, { fatigue: 0, wrestling: 100, polearm: 100, percussion: 100, endurance: 100 }));
      while (!qMatch.isFinished) resolveRound(qs, qMatch, { fightersA: qSquad, fightersB: qs.getFightersOfTeam(qMatch.teamBId).slice(0, 5).map((f) => f.id) }, () => 0);
      check(qMatch.kind === 'queen' && qs.playerFighters.slice(0, 5).every((f) => f.stats.fatigue >= MATCH_RULES.fatigue.roundWinner.min && f.stats.fatigue <= 100), 'Reine : fatigue appliquée par le système existant (règle des combats tant qu’aucune n’est définie)');
      const qReport = resolveQueenCombat(qs, qEvent, qMatch);
      check(qReport.won && getDeniers(qs) === deniersBefore + qChoice.reward && qEvent.status === 'done' && qEvent.data.result.reward === qChoice.reward, 'Reine : victoire → récompense versée (montant affiché)');
      check(JSON.stringify(qs.leagues.map((l) => l.toJSON())) === leaguesBefore, 'Reine : classement, matchs joués et calendrier de championnat inchangés');
      check(qEvent.data.secondaryMatches.every((m) => [m.teamAId, m.teamBId].includes(m.result?.winnerId)
        && Math.max(m.result.scoreA, m.result.scoreB) === MATCH_RULES.roundsToWin && (m.result.winnerId === m.teamAId) === (m.result.scoreA > m.result.scoreB)), 'Reine : 4 combats secondaires simulés par le moteur existant (vainqueur, manches)');
      const secondaryResults = JSON.stringify(qEvent.data.secondaryMatches);
      simulateSecondaryMatches(qs, qEvent, createRng('rejouer'));
      check(JSON.stringify(qEvent.data.secondaryMatches) === secondaryResults, 'Reine : chaque combat secondaire n’est simulé qu’une fois');
      const secondaryTeamIds = qEvent.data.secondaryMatches.flatMap((m) => [m.teamAId, m.teamBId]);
      check(qReport.type === 'queen.result' && !secondaryTeamIds.some((id) => JSON.stringify(qReport).includes(id)), 'Reine : combats secondaires absents du carnet de bord (seul le combat du joueur y figure)');
      const nextQueen = queenEvents(qs).find((e) => e.status === 'scheduled');
      check(nextQueen && nextQueen.day - qEvent.day >= 15 && (nextQueen.day - qEvent.day <= 18 || hasFixedCombatOn(qs.calendar, nextQueen.day - 1)), `Reine : la suivante planifiée 15 à 18 jours plus tard (jour ${nextQueen?.day})`);
      // Défaite : aucune récompense.
      const qs2 = createRandomGame({ rng: createRng('reine2') });
      const qEvent2 = queenEvents(qs2)[0];
      while (qs2.calendar.currentDay < qEvent2.day) advanceDay(qs2, { rng: never });
      selectOpponent(qs2, qEvent2, qEvent2.data.options[2].teamId);
      const qMatch2 = createQueenMatch(qs2, qEvent2);
      const deniers2 = getDeniers(qs2);
      while (!qMatch2.isFinished) resolveRound(qs2, qMatch2, { fightersA: qs2.playerFighters.slice(0, 5).map((f) => f.id), fightersB: qs2.getFightersOfTeam(qMatch2.teamBId).slice(0, 5).map((f) => f.id) }, () => 0.9999);
      const qReport2 = resolveQueenCombat(qs2, qEvent2, qMatch2);
      check(!qReport2.won && qReport2.reward === 0 && getDeniers(qs2) === deniers2 && qEvent2.outcome === 'lost', 'Reine : défaite → aucune récompense');
      // Sauvegarde : propositions, choix, récompense et résultat restaurés.
      const qSaves = new SaveSystem(new StorageBackend('behourd-smoketest-reine.'));
      qSaves.deleteAll();
      qSaves.save(qs2);
      const qLoaded = qSaves.load(qs2.saveId);
      check(JSON.stringify(queenEvents(qLoaded).map((e) => ({ ...e }))) === JSON.stringify(queenEvents(qs2).map((e) => ({ ...e }))), 'Reine : état complet restauré au chargement');
      qSaves.deleteAll();
      // Avance rapide : le Combat de la Reine est manqué (aucune récompense), le suivant est planifié.
      const qs3 = createRandomGame({ rng: createRng('reine3') });
      const qEvent3 = queenEvents(qs3)[0];
      const deniers3Before = getDeniers(qs3);
      const qs3Reports = [];
      while (qs3.calendar.currentDay <= qEvent3.day) qs3Reports.push(advanceDay(qs3, { rng: never }));
      const qs3Secondary = qEvent3.data.secondaryMatches ?? [];
      check(qs3Secondary.length === 4 && qs3Secondary.every((m) => m.result?.winnerId)
        && !qs3Reports.flatMap((r) => r.entries).some((e) => qs3Secondary.some((m) => JSON.stringify(e).includes(m.teamAId) || JSON.stringify(e).includes(m.teamBId))), 'Reine manquée : les 4 autres combats ont lieu quand même, hors carnet de bord');
      check(qEvent3.outcome === 'missed' && qEvent3.data.result === null && getDeniers(qs3) === deniers3Before && queenEvents(qs3).some((e) => e.status === 'scheduled'), 'Reine : non disputée (avance rapide) → manquée, sans récompense ; la suivante est planifiée');

      // ---------- Effectif : 20 combattants maximum, congédiement ----------
      const ro = createRandomGame({ rng: createRng('effectif') });
      check(MAX_TEAM_FIGHTERS === 20 && canRecruit(ro).ok, 'effectif : 8 / 20, recrutement possible');
      while (ro.playerFighters.length < 20) ro.addFighterToTeam(createRandomTeam({ rng: createRng(`r${ro.playerFighters.length}`) }).fighters[0], ro.player.teamId);
      ro.player.resources.deniers = 10000;
      const fullCheck = checkRecruit(ro, ro.recruitment.candidates[0].id);
      check(!canRecruit(ro).ok && !fullCheck.ok && /Effectif complet \(20 \/ 20\)/.test(fullCheck.reason), 'effectif : 20 / 20, recrutement impossible (effectif complet)');
      check(!recruit(ro, ro.recruitment.candidates[0].id).ok && ro.playerFighters.length === 20, 'effectif : la Taverne refuse un 21e combattant');
      const leaving = ro.playerFighters[3];
      assignActivity(ro, leaving.id, 'forest');
      const dismissal = dismiss(ro, leaving.id);
      check(dismissal.ok && ro.playerFighters.length === 19 && !ro.getFighter(leaving.id) && !ro.playerTeam.fighterIds.includes(leaving.id) && !ro.fighters.includes(leaving), 'congédiement : retiré définitivement (20 → 19)');
      check(canRecruit(ro).ok && !JSON.stringify(ro.toJSON()).includes(leaving.id) && !autoSelectSquad(ro, ro.player.teamId).some((f) => f.id === leaving.id), 'congédiement : place libérée ; absent des sélections et de la sauvegarde');
      while (ro.playerFighters.length > 1) dismiss(ro, ro.playerFighters[0].id);
      check(!canDismiss(ro, ro.playerFighters[0].id).ok, 'congédiement : la compagnie garde au moins un combattant');

      // ---------- Clubs de l'IA : recrutements, effectif de 10, niveau dynamique ----------
      const {
        listAIClubs, shouldRecruit, getReferenceLevel, generateRecruit, recruitForClub, buildAIRecruitmentEvent, runDailyAIRecruitment,
      } = await import('../src/systems/clubs/AIRecruitmentService.js');
      const { getWeakestFighter, getStrongestFighters, recalculateLevel } = await import('../src/systems/clubs/ClubService.js');
      const { MAX_AI_CLUB_FIGHTERS, AI_RECRUITMENT_CONFIG, AI_MAX_ROSTER_SIZE, AI_RETIREMENT_AGE, AI_MIN_ROSTER_AFTER_RETIREMENT, AI_DAILY_RECRUITMENT_CHANCE, AI_INITIAL_AGE_OFFSET, ROSTER_EVENT_TYPES } = await import('../src/data/aiRecruitment.js');
      const { LOGBOOK_FORMATS } = await import('../src/ui/report/logbookFormats.js');
      const { Fighter } = await import('../src/models/Fighter.js');
      const ai = createRandomGame({ rng: createRng('ia-recrutement') });
      const aiClub = ai.playerLeague.teamIds.find((id) => id !== ai.player.teamId);
      const aiLevel = (id) => ai.getFightersOfTeam(id).map((f) => computeFighterLevel(f));
      check(MAX_AI_CLUB_FIGHTERS === 12 && AI_MAX_ROSTER_SIZE === 12 && AI_RETIREMENT_AGE === 36 && AI_MIN_ROSTER_AFTER_RETIREMENT === 9 && AI_DAILY_RECRUITMENT_CHANCE === 0.01 && AI_INITIAL_AGE_OFFSET === -2 && ai.getFightersOfTeam(aiClub).length === 8, 'IA : effectif maximal 12, retraite 36 ans, remplacement sous 9, tirage 1 %, âge initial −2 (configuration commune), clubs de 8 au départ');
      const ranks = [...aiLevel(aiClub)].sort((a, b) => b - a);
      const refRange = ranks.slice(3, 7);
      const recruitPreview = generateRecruit(ai, aiClub, createRng('apercu'));
      check(AI_RECRUITMENT_CONFIG.referenceRange.from === 4 && AI_RECRUITMENT_CONFIG.referenceRange.to === 7 && getReferenceLevel(ai, aiClub, () => 0) === ranks[3] && getReferenceLevel(ai, aiClub, () => 0.999) === ranks[6]
        && refRange.map(Math.round).includes(computeFighterLevel(recruitPreview)) && ai.getFightersOfTeam(aiClub).length === 8, 'IA : recrue construite autour d’un des 4e à 7e plus forts (écart réglable, non défini : 0)');
      const refPicks = new Set(Array.from({ length: 200 }, (_, i) => getReferenceLevel(ai, aiClub, createRng(`ref${i}`))));
      check([...refPicks].every((l) => refRange.includes(l)) && refPicks.size === new Set(refRange).size, `IA : référence tirée au hasard parmi les positions 4 à 7 (${[...refPicks].length} niveaux distincts)`);

      check(Number.isInteger(recruitPreview.age) && recruitPreview.age >= 18 && recruitPreview.age <= 35, 'IA : la recrue reçoit un âge (18 à 35 ans)');
      check(recruitPreview instanceof Fighter && recruitPreview.name && SPECIALTY_IDS.includes(recruitPreview.specialtyId) && spriteIds.has(recruitPreview.spriteId) && recruitPreview.record?.matches?.played === 0 && recruitPreview.teamId === aiClub, 'IA : recrue complète (nom, spécialité, sprite, palmarès), même générateur que les clubs');
      const r9 = recruitForClub(ai, aiClub, createRng('r9'));
      const r10 = recruitForClub(ai, aiClub, createRng('r10'));
      const r10b = [recruitForClub(ai, aiClub, createRng('r10b')), recruitForClub(ai, aiClub, createRng('r10c'))];
      check(!r9.dismissed && !r10.dismissed && r10b.every((r) => !r.dismissed) && ai.getFightersOfTeam(aiClub).length === 12, 'IA : 8 → 9 → … → 12 combattants, sans congédiement');
      const weakestBefore = getWeakestFighter(ai, aiClub);
      const minLevel = Math.min(...aiLevel(aiClub));
      const r11 = recruitForClub(ai, aiClub, createRng('r11'));
      check(ai.getFightersOfTeam(aiClub).length === 12 && r11.dismissed?.id === weakestBefore.id && computeFighterLevel(weakestBefore) === minLevel && ai.getFightersOfTeam(aiClub).some((f) => f.id === r11.fighter.id), 'IA : 12 + recrue → le plus faible (niveau numérique) est congédié, effectif 12');
      const top8Avg = getStrongestFighters(ai, aiClub, 8).reduce((s, f) => s + computeFighterLevel(f), 0) / 8;
      check(Math.abs(r11.after.level - top8Avg) < 1e-9 && r11.after.stars === levelToStars(top8Avg) && r9.after.level >= r9.before.level, 'IA : niveau du club recalculé (nouveau top 8 → nouvelle moyenne → nouvelles étoiles)');
      check(Math.abs(getStandings(ai).find((r) => r.team.id === aiClub).level - top8Avg) < 1e-9, 'IA : classement et interfaces lisent le niveau actuel du club');
      // Visibilité dans le carnet : seulement la division actuelle du joueur.
      const l2Club = ai.getLeague('league_2').teamIds[0];
      const l2Recruit = recruitForClub(ai, l2Club, createRng('l2'));
      const l3Event = buildAIRecruitmentEvent(ai, r11);
      check(l3Event?.type === 'ai.recruitment' && l3Event.specialtyId === r11.fighter.specialtyId && buildAIRecruitmentEvent(ai, l2Recruit) === null, 'carnet : recrutement visible pour un club de la ligue du joueur, pas pour une autre ligue');
      ai.playerTeam.leagueId = 'league_2';
      check(buildAIRecruitmentEvent(ai, l2Recruit)?.leagueId === 'league_2' && buildAIRecruitmentEvent(ai, r11) === null, 'carnet : la règle suit la ligue actuelle du joueur');
      ai.playerTeam.leagueId = 'league_3';
      const hastierText = LOGBOOK_FORMATS['ai.recruitment']({ type: 'ai.recruitment', clubId: aiClub, specialtyId: 'hastier' }, { session: ai }).text;
      check(hastierText === `Un nouvel hastier a été recruté chez ${ai.getTeam(aiClub).name}.`
        && LOGBOOK_FORMATS['ai.recruitment']({ clubId: aiClub, specialtyId: 'runner' }, { session: ai }).text.startsWith('Un nouveau Runner a été recruté chez')

      const allReport = new (await import('../src/systems/report/DailyReportService.js')).DailyReport(1);

      check(allRecruits.length === listAIClubs(ai).length && allReport.ofType('ai.recruitment').length === 17 && allReport.entries.every((e) => e.leagueId === 'league_3'), 'carnet : sur toutes les recrues du jour, seules celles des 17 clubs de la ligue du joueur sont annoncées');
      check(listAIClubs(ai).every((id) => ai.getFightersOfTeam(id).length <= 12), 'IA : aucun club au-delà de 12 combattants');
      // Tirage indépendant par club : sur 200 jours, des journées à 0, 1 ou plusieurs recrues, jamais tous à la fois.
      const daily = createRandomGame({ rng: createRng('tirage-ia') });
      const perDay = Array.from({ length: 200 }, (_, d) => runDailyAIRecruitment(daily, { rng: createRng(`jour${d}`) }).length);
      const totalRecruits = perDay.reduce((a, b) => a + b, 0);
      const expectedRecruits = listAIClubs(daily).length * 200 * 0.01;
      check(Math.abs(totalRecruits - expectedRecruits) < expectedRecruits * 0.35 && perDay.some((n) => n === 0) && perDay.some((n) => n === 1) && Math.max(...perDay) < listAIClubs(daily).length, `IA : un tirage de 1 % par club (${totalRecruits} recrues en 200 jours, ≈ ${expectedRecruits} attendues)`);
      check(shouldRecruit(() => 0.0099) && !shouldRecruit(() => 0.01), 'IA : probabilité 1 %');
      // Sauvegarde : effectifs et recrues restaurés, niveaux recalculés à l'identique.
      const aiSaves = new SaveSystem(new StorageBackend('behourd-smoketest-ia.'));
      aiSaves.deleteAll();
      aiSaves.save(ai);
      const aiLoaded = aiSaves.load(ai.saveId);
      check(JSON.stringify(aiLoaded.getFightersOfTeam(aiClub).map((f) => [f.id, f.spriteId, computeFighterLevel(f)])) === JSON.stringify(ai.getFightersOfTeam(aiClub).map((f) => [f.id, f.spriteId, computeFighterLevel(f)]))
        && recalculateLevel(aiLoaded, aiClub).stars === recalculateLevel(ai, aiClub).stars && !('level' in (aiLoaded.toJSON().aiFighters[0] ?? {})), 'IA : effectifs et recrues sauvegardés ; niveaux et étoiles recalculés, jamais enregistrés');
      aiSaves.deleteAll();
      check(!ai.getFightersOfTeam(aiClub).some((f) => f.id === r11.dismissed.id) && !ai.aiRosters[aiClub].includes(r11.dismissed.id) && !ai.aiFighters.some((f) => f.id === r11.dismissed.id), 'IA : le congédié ne fait plus partie de l’effectif ni de la sauvegarde');

      // ---------- Clubs de l'IA : progression quotidienne, vieillissement, historique 30 jours ----------
      const {
        getDailyEvolution, runDailyAIProgression, changeAIFighterLevel, getProgressionNet, getIndicatorForNet, getProgressionIndicator,
        getIndicatorArrows, ageAIFighters, pruneProgressionEvents,
      } = await import('../src/systems/clubs/AIProgressionService.js');
      const { AI_PROGRESSION_CONFIG } = await import('../src/data/aiProgression.js');
      const evo = (score, age) => getDailyEvolution(new Fighter({ score }), age);
      const evoText = (score, age) => { const e = evo(score, age); return `${e.kind}:${Math.round(e.chance * 100)}`; };
      check([[0, 20], [30, 25], [60, 31]].every(([s, a]) => evoText(s, a) === 'gain:7') && evoText(61, 25) === 'gain:3' && evoText(85, 25) === 'gain:3' && evoText(86, 25) === 'gain:1' && evoText(100, 18) === 'gain:1'
        && Math.abs(evo(30, 25).chance - 0.1 / 1.5) < 1e-9 && Math.abs(evo(70, 25).chance - 0.05 / 1.5) < 1e-9 && Math.abs(evo(90, 25).chance - 0.02 / 1.5) < 1e-9,
        'progression IA (freinée ×1,5) : +1 niveau par jour à 6,7 % (0–3 ★), 3,3 % (3,5–4 ★), 1,3 % (4,5–5 ★)');
      check(evoText(40, 32) === 'loss:2' && evoText(40, 33) === 'loss:3' && evoText(40, 34) === 'loss:4' && evoText(40, 35) === 'loss:5' && evoText(95, 41) === 'loss:5' && evoText(10, 32) === 'loss:2',
        'vieillissement IA : dès 32 ans, plus de progression ; −1 niveau à 2 / 3 / 4 / 5 % (5 % au plus)');
      const pg = createRandomGame({ rng: createRng('progression-ia') });
      const pgFighters = listAIClubs(pg).flatMap((id) => pg.getFightersOfTeam(id));
      const pgAges = pgFighters.map((f) => f.age);
      const pgMeanAge = pgAges.reduce((a, b) => a + b, 0) / pgAges.length;
      check(pgFighters.length > 400 && pgFighters.every((f) => Number.isInteger(f.age) && f.age >= 18 && f.age <= 31) && Math.min(...pgAges) === 18 && Math.max(...pgAges) === 31 && Math.abs(pgMeanAge - 24.5) < 0.8,

      check(pg.playerFighters.every((f) => f.age >= 18 && f.age <= 35) && pg.playerFighters.some((f) => f.isCaptain && f.age === 21), 'âge initial : compagnie du joueur et capitaine inchangés');
      // Quelques vétérans (32 à 35 ans) pour éprouver le vieillissement.
      pgFighters.slice(0, 40).forEach((f, i) => { pg.aiFighterStates[f.id] = { ...pg.aiFighterStates[f.id], age: 32 + (i % 4) }; });
      const pgPlayerStats = JSON.stringify(pg.playerFighters.map((f) => [f.stats, f.age]));
      const pgBase = pgFighters.slice(0, 40).map((f) => clubDatabase.getFighter(f.id)?.score);
      const pgBefore = new Map(pgFighters.map((f) => [f.id, computeFighterLevel(f)]));
      const pgClub = pg.playerLeague.teamIds.find((id) => id !== pg.player.teamId);
      const pgClubBefore = recalculateLevel(pg, pgClub).level;
      const pgEvents = runDailyAIProgression(pg, { rng: () => 0 });
      const pgAfter = listAIClubs(pg).flatMap((id) => pg.getFightersOfTeam(id));
      const expectedDelta = (f) => (f.age >= 32 ? -1 : 1);
      check(pgAfter.every((f) => computeFighterLevel(f) === Math.max(0, Math.min(100, pgBefore.get(f.id) + expectedDelta(f))))
        && pgEvents.length === pgAfter.filter((f) => computeFighterLevel(f) !== pgBefore.get(f.id)).length && pgEvents.every((e) => e.day === pg.calendar.currentDay && e.newLevel - e.previousLevel === e.delta && Math.abs(e.delta) === 1),
        `progression IA : niveau numérique +1 (ou −1 dès 32 ans), événement enregistré (${pgEvents.length} ce jour)`);
      check(JSON.stringify(pg.playerFighters.map((f) => [f.stats, f.age])) === pgPlayerStats && !pgEvents.some((e) => pg.playerFighters.some((f) => f.id === e.fighterId)), 'progression IA : les combattants du joueur ne sont jamais modifiés');
      check(pgFighters.slice(0, 40).every((f, i) => clubDatabase.getFighter(f.id)?.score === pgBase[i]), 'progression IA : la base de clubs (partagée par les parties) n’est pas modifiée');
      const pgClubTop8 = getStrongestFighters(pg, pgClub, 8).reduce((s, f) => s + computeFighterLevel(f), 0) / 8;
      check(Math.abs(recalculateLevel(pg, pgClub).level - pgClubTop8) < 1e-9 && recalculateLevel(pg, pgClub).level !== pgClubBefore && Math.abs(getStandings(pg).find((r) => r.team.id === pgClub).level - pgClubTop8) < 1e-9, 'progression IA : niveau du club (8 meilleurs) recalculé, classement à jour');
      const pgSnapshot = JSON.stringify(pg.aiFighterStates);
      check(runDailyAIProgression(pg, { rng: () => 0 }).length === 0 && JSON.stringify(pg.aiFighterStates) === pgSnapshot, 'progression IA : une seule fois par jour');
      // Bornes 0 et 100.
      const young = pgAfter.find((f) => f.age < 32);
      const oldAI = pgAfter.find((f) => f.age >= 32);
      pg.aiFighterStates[young.id].levelDelta = 100 - clubDatabase.getFighter(young.id).score;
      pg.aiFighterStates[oldAI.id].levelDelta = -clubDatabase.getFighter(oldAI.id).score;
      check(computeFighterLevel(pg.getFighter(young.id)) === 100 && changeAIFighterLevel(pg, pg.getFighter(young.id), 1, 50) === null && computeFighterLevel(pg.getFighter(young.id)) === 100
        && changeAIFighterLevel(pg, pg.getFighter(oldAI.id), -1, 50) === null && computeFighterLevel(pg.getFighter(oldAI.id)) === 0, 'progression IA : niveau jamais au-delà de 100 ni sous 0 (aucun événement)');
      // Indicateur sur 30 jours (bilan net).
      check([[0, 'NONE'], [1, 'UP_1'], [2, 'UP_1'], [3, 'UP_2'], [4, 'UP_3'], [9, 'UP_3'], [-1, 'DOWN'], [-4, 'DOWN']].every(([n, id]) => getIndicatorForNet(n) === id)
        && getIndicatorArrows('UP_1') === '↑' && getIndicatorArrows('UP_2') === '↑↑' && getIndicatorArrows('UP_3') === '↑↑↑' && getIndicatorArrows('DOWN') === '↓' && getIndicatorArrows('NONE') === '',
        'indicateur : 0 rien · +1/+2 ↑ · +3 ↑↑ · +4 et plus ↑↑↑ · −1 et moins ↓');
      const ind = { aiProgressionEvents: [], calendar: { currentDay: 100 } };
      const addEv = (id, day, delta) => ind.aiProgressionEvents.push({ fighterId: id, day, previousLevel: 50, newLevel: 50 + delta, delta });
      [75, 80, 90].forEach((d) => addEv('a', d, 1)); addEv('a', 95, -1);
      [72, 74].forEach((d) => addEv('b', d, 1)); [80, 81, 82].forEach((d) => addEv('b', d, -1));
      [71, 72, 73].forEach((d) => addEv('c', d, 1)); [74, 75, 76].forEach((d) => addEv('c', d, -1));
      addEv('d', 70, 5); addEv('d', 71, 1);
      check(getProgressionIndicator(ind, 'a', 100) === 'UP_1' && getProgressionIndicator(ind, 'b', 100) === 'DOWN' && getProgressionIndicator(ind, 'c', 100) === 'NONE' && getProgressionNet(ind, 'a', 100) === 2,
        'indicateur : bilan net (+3 −1 → ↑ ; +2 −3 → ↓ ; +3 −3 → rien)');
      check(getProgressionNet(ind, 'd', 100) === 1 && getProgressionIndicator(ind, 'd', 100) === 'UP_1' && getProgressionIndicator(ind, 'zz', 100) === 'NONE', 'indicateur : seuls les 30 derniers jours comptent (jour 70 exclu au jour 100)');
      pruneProgressionEvents(ind, 100);
      check(ind.aiProgressionEvents.every((e) => e.day >= 71) && ind.aiProgressionEvents.length === 16, 'historique : événements de plus de 30 jours supprimés');
      // Persistance : niveaux, âges, historique et jour traité.
      const pgSaves = new SaveSystem(new StorageBackend('behourd-smoketest-progression.'));
      pgSaves.deleteAll();
      pgSaves.save(pg);
      const pgLoaded = pgSaves.load(pg.saveId);
      const levelsOf = (s) => JSON.stringify(listAIClubs(s).flatMap((id) => s.getFightersOfTeam(id)).map((f) => [f.id, computeFighterLevel(f), f.age]));
      check(levelsOf(pgLoaded) === levelsOf(pg) && JSON.stringify(pgLoaded.aiProgressionEvents) === JSON.stringify(pg.aiProgressionEvents) && pgLoaded.aiProgressionDay === pg.aiProgressionDay
        && runDailyAIProgression(pgLoaded, { rng: () => 0 }).length === 0, 'persistance : niveaux, âges et historique restaurés ; aucune nouvelle progression au chargement');
      pgSaves.deleteAll();
      // Fin de saison : +1 an pour les combattants de l'IA.
      const aiAgesBefore = listAIClubs(pg).flatMap((id) => pg.getFightersOfTeam(id)).map((f) => f.age);
      ageAIFighters(pg);
      check(listAIClubs(pg).flatMap((id) => pg.getFightersOfTeam(id)).every((f, i) => f.age === aiAgesBefore[i] + 1), 'vieillissement : +1 an par fin de saison pour les combattants de l’IA');
      // Journée complète : phase après les recrutements, rien au carnet de bord.
      const pgDay = createRandomGame({ rng: createRng('progression-jour') });
      // Âges de départ 18 à 31 : on vieillit l'IA de 3 ans pour avoir des combattants de 32 ans et plus (baisses possibles).
      for (let y = 0; y < 3; y++) ageAIFighters(pgDay);
      const pgReports = Array.from({ length: 30 }, () => advanceDay(pgDay, { rng: createRng(`pj${pgDay.calendar.currentDay}`) }));
      const pgDeltas = pgDay.aiProgressionEvents.map((e) => e.delta);
      check(DAY_PHASES.map((p) => p.id).indexOf('ai-progression') === DAY_PHASES.map((p) => p.id).indexOf('ai-recruitment') + 1 && DAY_PHASES.map((p) => p.id).indexOf('ai-progression') < DAY_PHASES.map((p) => p.id).indexOf('league')
        && pgDay.aiProgressionDay === pgDay.calendar.currentDay && pgDeltas.includes(1) && pgDeltas.includes(-1)
        && !pgReports.flatMap((r) => r.entries).some((e) => /progress/i.test(e.type) || pgDay.aiProgressionEvents.some((p) => e.fighterId === p.fighterId)), `journée : progression de l’IA après les recrutements, avant la ligue ; rien au carnet (${pgDeltas.filter((d) => d > 0).length} hausses, ${pgDeltas.filter((d) => d < 0).length} baisses en 30 jours)`);

      // ---------- Clubs de l'IA : retraite, remplacement, historique d'effectif ----------
      const { runAIRetirements, getClubRosterEvents, hasRetirementAge } = await import('../src/systems/clubs/AIRecruitmentService.js');
      const { describeRosterEvent } = await import('../src/ui/components/ClubRosterHistory.js');
      const rt = createRandomGame({ rng: createRng('retraite') });

      const setAge = (s, f, age) => { if (s.aiFighters.includes(f)) f.age = age; else s.aiFighterStates[f.id] = { ...s.aiFighterStates[f.id], age }; };
      // Club de 8 : un combattant de 36 ans part, l'effectif passe à 7 → remplacé aussitôt (8).
      const rtA = rtClubs[0];
      const retiree = rt.getFightersOfTeam(rtA)[2];
      const keeper = rt.getFightersOfTeam(rtA)[3];

      const rtAEvents = getClubRosterEvents(rt, rtA);
      check(rtRetired.length === 1 && rtRetired[0].fighter.id === retiree.id && !rt.getFightersOfTeam(rtA).some((f) => f.id === retiree.id) && rt.getFightersOfTeam(rtA).some((f) => f.id === keeper.id),

      check(rt.getFightersOfTeam(rtA).length === 8 && rtRetired[0].replacement && rt.getFightersOfTeam(rtA).some((f) => f.id === rtRetired[0].replacement.id)
        && rtAEvents.map((e) => e.type).join() === 'DEPART_RETRAITE,RECRUITMENT' && rtAEvents[1].metadata.reason === 'replacement', 'retraite : effectif passé à 7 (sous 9) → recrue de remplacement directe, effectif 8');
      // Club de 10 : la retraite le laisse à 9, aucun remplacement.
      const rtB = rtClubs[1];
      recruitForClub(rt, rtB, createRng('rtb1'));
      recruitForClub(rt, rtB, createRng('rtb2'));
      setAge(rt, rt.getFightersOfTeam(rtB)[0], 37);
      const rtBRetired = runAIRetirements(rt, { rng: createRng('rt2') });
      check(rtBRetired.length === 1 && !rtBRetired[0].replacement && rt.getFightersOfTeam(rtB).length === 9 && getClubRosterEvents(rt, rtB).at(-1).type === 'DEPART_RETRAITE', 'retraite : 10 → 9, pas de remplacement (9 ou plus)');
      check(listAIClubs(rt).flatMap((id) => rt.getFightersOfTeam(id)).every((f) => !hasRetirementAge(f)) && runAIRetirements(rt, { rng: createRng('rt3') }).length === 0, 'retraite : plus aucun combattant de 36 ans ou plus en activité');
      // Historique : événements figés, textes.
      const rtRetireEvent = rtAEvents[0];
      check(rtRetireEvent.fighterName === retiree.name && rtRetireEvent.fighterAge === 36 && rtRetireEvent.specialty === retiree.specialtyId && rtRetireEvent.day === rt.calendar.currentDay && rtRetireEvent.id,
        'historique : nom, âge, spécialité et jour figés dans l’événement');
      const replacementFighter = rt.getFighter(rtRetired[0].replacement.id);
      const replacementEvent = rtAEvents[1];
      replacementFighter.name = 'Nom changé';
      replacementFighter.age += 3;
      check(replacementEvent.fighterName !== 'Nom changé' && replacementEvent.fighterAge === replacementFighter.age - 3, 'historique : un changement ultérieur du combattant ne modifie pas l’événement');
      const ev = (type, name, age, specialty) => describeRosterEvent({ type, fighterName: name, fighterAge: age, specialty }).text;
      check(ev('RECRUITMENT', 'Eudes', 23, 'hastier') === 'Eudes (23 ans), nouvel hastier a été recruté.' && ev('RECRUITMENT', 'Odo', 20, 'lutteur') === 'Odo (20 ans), nouveau lutteur a été recruté.'
        && ev('DEPART_NIVEAU', 'Jean', 26, 'runner') === 'Jean (26 ans), a été congédié.' && ev('DEPART_RETRAITE', 'Marc', 36, 'lutteur') === 'Marc (36 ans), est parti du club (retraite).',
        'historique : « Eudes (23 ans), nouvel hastier a été recruté. » · « Jean (26 ans), a été congédié. » · « Marc (36 ans), est parti du club (retraite). »');
      // Départ lié au niveau : au-delà de 12, le plus faible, inscrit DEPART_NIVEAU.
      const rtC = rtClubs[2];
      for (let i = 0; i < 4; i++) recruitForClub(rt, rtC, createRng(`rtc${i}`));
      const rtWeakest = getWeakestFighter(rt, rtC);
      const rtOver = recruitForClub(rt, rtC, createRng('rtc-over'));
      const rtCEvents = getClubRosterEvents(rt, rtC);
      check(rt.getFightersOfTeam(rtC).length === 12 && rtOver.dismissed?.id === rtWeakest.id && rtCEvents.filter((e) => e.type === 'RECRUITMENT').length === 5 && rtCEvents.filter((e) => e.type === 'RECRUITMENT').every((e) => e.metadata.reason === 'natural')
        && rtCEvents.at(-1).type === 'DEPART_NIVEAU' && rtCEvents.at(-1).fighterId === rtWeakest.id, 'départ lié au niveau : 13e recrue → le plus faible congédié (DEPART_NIVEAU), effectif 12 ; recrutements inscrits');
      // Recrutement intensif : jamais plus de 12.
      for (let i = 0; i < 6; i++) runDailyAIRecruitment(rt, { rng: () => 0 });
      check(listAIClubs(rt).every((id) => rt.getFightersOfTeam(id).length <= 12) && listAIClubs(rt).some((id) => rt.getFightersOfTeam(id).length === 12), 'effectif : jamais plus de 12 combattants par club de l’IA');
      // Journée : retraite avant les autres phases ; le retraité ne fait plus partie de rien.
      const rtDayClub = rtClubs[3];
      const rtDayRetiree = rt.getFightersOfTeam(rtDayClub)[0];
      setAge(rt, rtDayRetiree, 36);
      advanceDay(rt, { rng: createRng('rt-jour') });
      check(DAY_PHASES.map((p) => p.id).indexOf('ai-retirement') < DAY_PHASES.map((p) => p.id).indexOf('ai-recruitment') && !rt.getFightersOfTeam(rtDayClub).some((f) => f.id === rtDayRetiree.id)
        && getClubRosterEvents(rt, rtDayClub).some((e) => e.type === 'DEPART_RETRAITE' && e.fighterId === rtDayRetiree.id && e.day === rt.calendar.currentDay)
        && !rt.aiProgressionEvents.some((e) => e.fighterId === rtDayRetiree.id && e.day === rt.calendar.currentDay), 'journée : retraite traitée en premier ; le retraité n’est plus dans l’effectif ni dans la progression');
      // Fin de saison : +1 an puis retraite immédiate de ceux qui atteignent 36 ans.

      const cdfWorstExtra = cdfFourths.filter((r) => cdfQ.extra.includes(r.teamId)).sort((a, b) => a.points - b.points)[0];

      check(cdfQ.qualified.length === 32 && new Set(cdfQ.qualified).size === 32 && cdfQ.direct.length === 27
        && cdfGroupRows.every((rows) => rows.slice(0, 3).every((r) => cdfQ.direct.includes(r.teamId))) && cdfQ.extra.length === 5
        && cdfQ.extra.every((id) => cdfFourths.some((r) => r.teamId === id)) && cdfWorstExtra.points >= cdfBestOut.points && cdfQ.eliminated.length === 22,
        'qualification : les 3 premiers de chaque poule (27) et les 5 meilleurs 4es (à valider) = 32, sans doublon');
      const cdfRounds = cdfCup.bracket.rounds;
      const cdfLosers = new Set();
      let cdfBracketOk = cdfRounds.map((r) => r.matches.length).join() === '16,8,4,2,1' && cdfRounds.map((r) => r.name).join() === cdfRules.knockoutRounds.join();
      cdfRounds.forEach((round, i) => {
        const teams = round.matches.flatMap((m) => [m.teamAId, m.teamBId]);
        if (new Set(teams).size !== teams.length || teams.some((id) => cdfLosers.has(id) || (i === 0 && !cdfQ.qualified.includes(id)))) cdfBracketOk = false;
        for (const m of round.matches) {
          if (m.status !== 'played') cdfBracketOk = false;
          cdfLosers.add(m.winnerId === m.teamAId ? m.teamBId : m.teamAId);
          if (i > 0 && !cdfRounds[i - 1].matches.some((p) => p.winnerId === m.teamAId) ) cdfBracketOk = false;
        }
      });
      check(cdfBracketOk, 'tableau : seizièmes → huitièmes → quarts → demies → finale, aucune équipe en double, aucun éliminé ni non-qualifié qui revient');

      // ---------- Palmarès et classements des combattants (v0.55.0) ----------

        // 3.4. Filtres de combattants : classe et tri combinés, la sélection n'est jamais touchée.

        pFighters.forEach((f) => { f.activityId = null; });
        Object.assign(f0, { activityId: 'dummies' });

        f3.activityId = 'forest';
        const crowded = { assignments: [{ fighterId: f0.id, activityId: 'forest' }, { fighterId: f1.id, activityId: 'forest' }, { fighterId: f2.id, activityId: 'forest' }], resetOthers: false };

          && f3.activityId === 'forest' && f2.activityId === 'hay' && brokenInfo.departed === 1 && brokenInfo.unknownActivities === 1 && brokenInfo.invalid === 2,

        check(palmaresView?.querySelectorAll('.palmares-item').length === 6 && palmaresView.querySelectorAll('.palmares-item.is-ribbon').length === 3 && palmaresView.querySelector('.palmares-sep')
          && palmaresView.querySelector('[data-palmares="league_1"] .palmares-count').textContent === '×2' && palmaresView.querySelectorAll('canvas').length === 6
          && !/Saison/.test(palmaresView.textContent) && ClubPalmares(pGame, pGame.player.teamId) === null,

        const { openClubSheet: openSheetV69 } = await import('../src/ui/components/ClubSheet.js');
        const sheet = openSheetV69(pGame, pGame.getTeam(rivalId));

      }
      // ---------- v0.70 : les quatre saisons de l'année ----------
      {
        const C = await import('../src/systems/climate/ClimateService.js');

        const seasonOf = (day) => C.getSeasonForDay(day).id;
        // Calendrier : 100 jours, 4 × 25, été → automne → hiver → printemps, puis l'été suivant.
        check([1, 25, 26, 50, 51, 75, 76, 100, 101, 126].map(seasonOf).join() === 'summer,summer,autumn,autumn,winter,winter,spring,spring,summer,autumn'
          && C.dayOfYear(101) === 1 && C.yearOf(100) === 1 && C.yearOf(101) === 2 && C.seasonStartingOn(1) === null && C.seasonStartingOn(26)?.id === 'autumn'
          && C.seasonStartingOn(101)?.id === 'summer' && C.seasonStartingOn(27) === null && C.seasonProgress(32).day === 7 && CS.length === 4,

        const sGame = createRandomGame({ rng: createRng('saisons') });
        check(sGame.calendar.currentDay === 1 && C.getCurrentSeason(sGame).id === 'summer', 'saisons : une nouvelle partie commence au jour 1 de l’été');
        const { SeasonBadge } = await import('../src/ui/components/CalendarBar.js');
        const badge = SeasonBadge(32);
        check(badge.textContent.includes('Automne') && badge.classList.contains('is-autumn') && badge.style.getPropertyValue('--season-color') === CS[1].color && badge.querySelector('.season-badge-icon')?.textContent === '🍂'
          && SeasonBadge(60).textContent.includes('Hiver') && SeasonBadge(80).textContent.includes('Printemps') && SeasonBadge(3).textContent.includes('Été'),
          'saisons : pastille sous le jour (icône + nom, couleur de la saison)');

        const { assignActivity: assignS, getActivityClosure } = await import('../src/systems/activities/ActivityService.js');
        const { isCombatDay: combatOn } = await import('../src/systems/calendar/CalendarService.js');
        const freeDay = (from, to) => { for (let d = from; d <= to; d++) if (!combatOn(sGame.calendar, d) && !combatOn(sGame.calendar, d - 1)) return d; return null; };
        const [s0, s1, s2] = sGame.playerFighters;
        const riverSummer = assignS(sGame, s0.id, 'river');
        const forestSummer = assignS(sGame, s1.id, 'forest');
        check(!riverSummer.ok && riverSummer.reason.includes('asséchée') && s0.activityId === null && forestSummer.ok && getActivityClosure(sGame, 'river') && !getActivityClosure(sGame, 'forest'),
          'saisons (été) : la rivière est asséchée — affectation refusée ; la forêt reste ouverte');
        const lastAutumn = freeDay(45, 50) ?? 50;

            scr.canvas.dispatchEvent(new MouseEvent('click', at(10.5, 2.5)));
          }
          await wait(40);
        }
        const order = seen.map((x) => x.split(':')[0]).join('');
        check(!TU.isTutorialActive() && seen.length === steps.length && /^1+2+3+$/.test(order) && !finishEarly && skipAlways
          && !document.querySelector('.tutorial-layer') && !document.body.classList.contains('has-tutorial'),
          `tutoriel : (1/3) → (2/3) → (3/3), « Passer » toujours là, « Terminer » seulement à la fin, puis le calque disparaît (${seen.length} bulles${seen.length === steps.length ? '' : ` : ${seen.join(' ')}`})`);
        check(seen.some((x) => x.endsWith('roles@team')) && seen.some((x) => x.endsWith('centre@centre')) && seen.some((x) => x.endsWith('recruits@tavern')) && blockedOther,
          'tutoriel : on clique soi-même « La Compagnie », « Le Centre », « La Taverne » — les autres boutons restent bloqués');
        check(wrongTile && tg.playerFighters.some((f) => f.activityId === 'lice'),
          'tutoriel : clic sur la Petite lice demandé (un autre lieu de la carte ne compte pas), puis le bouton « + » y envoie des combattants');
        check(watched, 'tutoriel : après le « + », 2 secondes pour regarder les combattants partir vers la Petite lice, puis la bulle suivante');
        check(tg.calendar.currentDay === day0 && window.behourd.screens.currentId === 'centre',
          'tutoriel : la journée ne passe jamais pendant le tutoriel ; « Terminer » ramène au Centre');
        // Passer à tout moment ; quitter le domaine (menu principal) l'arrête aussi.
        window.behourd.screens.show('centre', { tutorial: true });
        await wait(40);
        const startedAgain = TU.isTutorialActive();
        button('Passer le tutoriel', bubble()).click();
        await wait(10);
        const skipped = !TU.isTutorialActive() && !document.querySelector('.tutorial-layer') && window.behourd.screens.currentId === 'centre';
        TU.startTutorial();
        await wait(20);
        window.behourd.screens.show('main-menu', {});
        await wait(40);
        check(startedAgain && skipped && !TU.isTutorialActive() && !document.querySelector('.tutorial-layer'),
          'tutoriel : « Passer le tutoriel » le referme aussitôt ; il s’arrête aussi en quittant le domaine');
      }

      // ---------- v0.79 : langues — français, anglais, espagnol ----------
      {
        const I = await import('../src/i18n/i18n.js');
        const { STRINGS: EN } = await import('../src/i18n/en.js');
        const { STRINGS: ES } = await import('../src/i18n/es.js');
        // Moteur : texte exact, phrase à trous (ordre libre, accord), bords, séparateurs, noms propres.
        await I.setLanguage('en', { store: false, dictionary: {
          'Banquet': 'Feast', 'Le Centre': 'The Centre', '{0} est épuisé (fatigue {1})': 'Exhausted ({1}): {0}',
          '{0} combattant{1}': '{0} fighter{1?s:}', 'Victoire {0} !': 'Victory for {0}!', 'Capitaine : {0}': 'Captain: {0}',
          'Été': 'Summer', 'hors combat': 'outside combat', 'pendant le placement': 'during placement', '{0} sur {1}': '{0} out of {1}',
          'Les classements et trophées': 'Rankings and trophies',
        } });
        const tt = I.translateText;
        const engineOk = [
          tt('Banquet') === 'Feast', tt('  Banquet ') === '  Feast ', tt('🍗 Banquet ›') === '🍗 Feast ›',
          tt('Thierry est épuisé (fatigue 72)') === 'Exhausted (72): Thierry', tt('3 combattants') === '3 fighters', tt('1 combattant') === '1 fighter',
          tt('Le Centre · Été') === 'The Centre · Summer', tt('hors combat et pendant le placement') === 'outside combat and during placement',
          tt('Victoire Les Loups de Lille !') === 'Victory for Les Loups de Lille!', tt('Les Loups de Lille') === 'Les Loups de Lille',
          tt('Banquet (Été)') === 'Feast (Summer)', tt('🏆 Les classements et trophées') === '🏆 Rankings and trophies',
          tt('Capitaine : Arnaud · Été') === 'Captain: Arnaud · Summer', tt('2 sur 3') === '2 out of 3',
        ];
        check(engineOk.every(Boolean), `langues : moteur de traduction (texte exact, trous, accords, icônes, séparateurs, noms propres gardés) — ${engineOk.map((ok, i) => (ok ? '' : i)).filter((x) => x !== '').join(',') || 'tout bon'}`);
        // Dictionnaires : mêmes phrases en anglais et en espagnol, trous et balises de l'Almanach préservés.
        const holes = (text) => [...text.matchAll(/\{(\d+)(?:\?[^}]*)?\}/g)].map((m) => m[1]);
        const tags = (text) => [...text.matchAll(/\{\{[^}]+\}\}|\[\[[^\]|]+/g)].map((m) => m[0]).sort().join();
        const consistent = (dict) => Object.entries(dict).every(([fr, tr]) => holes(tr).every((n) => holes(fr).includes(n)) && tags(fr) === tags(tr));
        check(Object.keys(EN).length > 2400 && Object.keys(EN).length === Object.keys(ES).length && consistent(EN) && consistent(ES)
          && EN['Passer la journée ▸'] === 'End the day ▸' && ES['Jouer'] === 'Jugar' && EN['Le Bourg'] === 'The Town',
          `langues : dictionnaires anglais et espagnol complets (${Object.keys(EN).length} phrases), trous et balises préservés`);
        // Écran principal : drapeau en haut à droite, trois langues, bascule et mémorisation.
        await I.setLanguage('fr', { store: false });
        window.behourd.screens.show('main-menu', {});
        await wait(30);
        const picker = app.querySelector('.language-picker');
        picker.querySelector('.language-toggle').click();
        const options = [...picker.querySelectorAll('.language-option')].map((b) => b.dataset.language).join();
        picker.querySelector('[data-language="en"]').click();
        await wait(150);
        const playEn = [...app.querySelectorAll('.main-menu button')].map((b) => b.textContent);
        const storedEn = localStorage.getItem('behourd.language');
        const locale = I.currentLocale();
        const htmlLang = document.documentElement.lang;
        app.querySelector('.language-toggle').click();
        app.querySelector('[data-language="es"]').click();
        await wait(150);
        const playEs = app.querySelector('.main-menu button')?.textContent;
        app.querySelector('.language-toggle').click();
        app.querySelector('[data-language="fr"]').click();
        await wait(150);
        const playFr = app.querySelector('.main-menu button')?.textContent;
        check(picker && options === 'fr,en,es' && playEn.join() === 'Play,Load,Options,Quit game' && storedEn === 'en' && locale === 'en-GB' && htmlLang === 'en'
          && playEs === 'Jugar' && playFr === 'Jouer' && localStorage.getItem('behourd.language') === 'fr' && I.getLanguage() === 'fr'
          && CanvasRenderingContext2D.prototype.fillText.name === 'translated',
          'langues : drapeau en haut à droite de l’écran principal, français / anglais / espagnol, bascule immédiate et mémorisée (français par défaut) ; texte des cartes traduit aussi');
        localStorage.removeItem('behourd.language');
      }
    } catch (error) {
      lines.push(`ERROR ${error.stack ?? error}`);
      failures++;
    } finally {
      clearGameKeys();
      for (const key of Object.keys({ ...localStorage })) if (key.startsWith('behourd-smoketest')) localStorage.removeItem(key);
      for (const [key, value] of Object.entries(backup)) localStorage.setItem(key, value);
      document.getElementById('results').textContent =
        `${failures ? `ÉCHEC (${failures})` : 'SUCCÈS'}\n${lines.join('\n')}`;
    }
  </script>
</body>
</html>
