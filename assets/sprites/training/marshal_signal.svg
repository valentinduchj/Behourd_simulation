<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 64" width="44" height="64">
  <!-- Ma Lice d'entraînement : le Marshal, arbitre du béhourd (tenue jaune rayée de noir). Signal de départ. -->
  <g stroke="#1f160d" stroke-width="0.8" stroke-linejoin="round">
    <!-- Jambes et bottes -->
    <path d="M15 50 L14.5 61 L19 61 L19.5 50Z" fill="#2a2420"/>
    <path d="M21 50 L21.5 61 L26 61 L25.5 50Z" fill="#2a2420"/>
    <path d="M13.5 60.5 h6.2 v2.4 h-7.4z M20.8 60.5 h6.2 v2.4 h-7.4z" fill="#4a3220"/>
    <!-- Tunique jaune -->
    <path d="M12.5 26 Q20 22 27.5 26 L29.5 52 Q20 54.5 10.5 52Z" fill="#f0c419"/>
    <!-- Rayures noires bien visibles -->
    <path d="M12 31 h16.4 v3 h-16.6z M11.6 37 h17.3 v3 h-17.4z M11.2 43 h18.1 v3 h-18.2z M10.9 49 h18.7 v2.6 h-18.8z" fill="#151515" stroke="none"/>
    <!-- Ceinture -->
    <rect x="11.4" y="40.2" width="17.6" height="1.6" fill="#6b4a2b" stroke="none"/>
    <!-- Bras gauche (le long du corps) -->
    <path d="M12.3 26.5 L9 42 L12 43.5 L15.5 30Z" fill="#f0c419"/>
    <path d="M10.1 35 l3.2 0.6 M9.6 38.5 l3.2 0.6" stroke="#151515" stroke-width="1.6"/>
    <circle cx="10.5" cy="43.5" r="2.1" fill="#e8bf98"/>
    <!-- Bras droit levé : le bâton haut, drapeau jaune déployé (signal de départ) -->
    <path d="M27.3 26 L33 14 L35.5 15.5 L29.5 29Z" fill="#f0c419"/>
    <path d="M29.6 21 l2.6 1.4 M31.4 17.4 l2.6 1.4" stroke="#151515" stroke-width="1.6"/>
    <rect x="33.2" y="0.5" width="2" height="38" rx="0.9" fill="#8a5a2b"/>
    <path d="M35.2 1 L43.5 3.5 L35.2 7.5Z" fill="#f0c419"/>
    <circle cx="34.2" cy="14.4" r="2.1" fill="#e8bf98"/>
    <!-- Tête -->
    <circle cx="20" cy="16" r="6" fill="#e8bf98"/>
    <path d="M15 18 Q16 23 20 23.2 Q24 23 25 18 Q23 20.5 20 20.4 Q17 20.5 15 18Z" fill="#7a5230"/>
    <!-- Chapeau jaune à large bord, bande noire -->
    <ellipse cx="20" cy="11.2" rx="10.5" ry="2.6" fill="#e6b414"/>
    <path d="M14 11 Q14 4.5 20 4.5 Q26 4.5 26 11Z" fill="#f0c419"/>
    <path d="M14.2 9.6 h11.6 v1.6 h-11.6z" fill="#151515" stroke="none"/>
  </g>
  <g fill="#1a1a1a" stroke="none"><circle cx="18" cy="15.8" r="0.75"/><circle cx="22" cy="15.8" r="0.75"/></g>
</svg>