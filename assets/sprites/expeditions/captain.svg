    <circle cx="16.6" cy="52.5" r="1.3" fill="#d2d8dc"/>
    <circle cx="23.4" cy="52.5" r="1.3" fill="#d2d8dc"/>
    <!-- tabard -->
    <path d="M13 26 Q20 23 27 26 L28 49 Q20 51 12 49Z" fill="#9e1f2c"/>
    <path d="M18.6 28 h2.8 v8 h5.2 v2.8 h-5.2 v9.6 h-2.8 v-9.6 h-5.2 v-2.8 h5.2Z" fill="#e0b43a"/>
    <rect x="12.4" y="40.6" width="15.2" height="2.4" fill="#3a2414"/>
    <rect x="18.8" y="40.2" width="2.6" height="3.2" rx="0.4" fill="#e0b43a"/>
