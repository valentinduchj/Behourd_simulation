    <path d="M9.5 25 Q13 21.5 16 25.5 L14.5 30 Q11 29 9.5 25Z" fill="#c3c9ce"/>
    <path d="M30.5 25 Q27 21.5 24 25.5 L25.5 30 Q29 29 30.5 25Z" fill="#c3c9ce"/>
    <!-- bras -->
    <path d="M10.5 28 L8.5 41 L11.8 42 L14 30Z" fill="#a9b0b6"/>
    <path d="M29.5 28 L31.5 41 L28.2 42 L26 30Z" fill="#a9b0b6"/>
    <circle cx="10.2" cy="42.3" r="2.1" fill="#6f777e"/>
    <circle cx="29.8" cy="42.3" r="2.1" fill="#6f777e"/>
    <!-- épée, pointe au sol -->
    <path d="M32.6 42 L33.4 42 L33.6 60 L33 61.6 L32.4 60Z" fill="#dfe4e8"/>
    <path d="M30 41.3 h6.2 v1.4 h-6.2Z" fill="#e0b43a"/>
