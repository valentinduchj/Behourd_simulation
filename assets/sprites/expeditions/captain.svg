    <circle cx="20" cy="17" r="5.6" fill="#e2b48e"/>
    <path d="M15.4 18.5 Q16 24 20 24.4 Q24 24 24.6 18.5 Q22.5 21 20 21 Q17.5 21 15.4 18.5Z" fill="#6b4226"/>
    <path d="M17 17.2 h2 M21 17.2 h2" stroke="#1f160d" stroke-width="1"/>
    <!-- casque (bassinet ouvert) et panache -->
    <path d="M13.6 16 Q13.4 7.5 20 6.6 Q26.6 7.5 26.4 16 L24.8 16 Q24.6 11 20 10.6 Q15.4 11 15.2 16Z" fill="#c3c9ce"/>
    <path d="M13.6 16 L13 21 L15.4 21.5 L15.2 16Z M26.4 16 L27 21 L24.6 21.5 L24.8 16Z" fill="#a9b0b6"/>
    <path d="M20 6.8 Q19 1.5 24 0.8 Q27.5 1.2 27 4 Q23.5 2.8 22 6.6Z" fill="#c8202f"/>
    <path d="M21.5 6.4 Q22 3 25.5 2.4" fill="none" stroke="#f4d36b" stroke-width="0.9"/>
