<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 64" width="40" height="64">
  <!-- Scriptorium : la Professeure Flavia (robe vert forêt brodée d'or, couronne et voile, livre) -->
  <g stroke="#1f160d" stroke-width="0.8" stroke-linejoin="round">
    <!-- Voile qui tombe dans le dos -->
    <path d="M13 11 Q9 24 10.5 40 L29.5 40 Q31 24 27 11Z" fill="#f2efe6" opacity="0.95"/>
    <!-- Robe : jupe ample, traîne, plis -->
    <path d="M14 27 Q20 24 26 27 L32 61.5 Q20 64.5 8 61.5Z" fill="#1f5a34"/>
    <path d="M17 33 L14.5 61.5 M23 33 L25.5 61.5 M20 34 L20 62.5" fill="none" stroke="#164427" stroke-width="0.9"/>
    <!-- Ourlet et devant brodés d'or -->
    <path d="M8.5 60.5 Q20 63.5 31.5 60.5" fill="none" stroke="#e0b43a" stroke-width="1.6"/>
    <path d="M18 30 L16.8 60 M22 30 L23.2 60" fill="none" stroke="#e0b43a" stroke-width="0.9"/>
    <circle cx="20" cy="40" r="0.9" fill="#e0b43a" stroke="none"/>
    <circle cx="20" cy="47" r="0.9" fill="#e0b43a" stroke="none"/>
    <circle cx="20" cy="54" r="0.9" fill="#e0b43a" stroke="none"/>
    <!-- Corsage ajusté et ceinture -->
    <path d="M14.5 25.5 Q20 23 25.5 25.5 L25 33 Q20 34.5 15 33Z" fill="#2a7244"/>
    <rect x="14.6" y="32" width="10.8" height="1.8" fill="#e0b43a"/>
    <!-- Manches évasées (bords dorés) -->
    <path d="M14 26 L8.5 41 L12.8 42.6 L16 31Z" fill="#1f5a34"/>
    <path d="M26 26 L31.5 41 L27.2 42.6 L24 31Z" fill="#1f5a34"/>
    <path d="M8.5 41 L12.8 42.6 M31.5 41 L27.2 42.6" stroke="#e0b43a" stroke-width="1.2"/>
    <!-- Mains et livre relié -->
    <circle cx="11" cy="42.5" r="1.9" fill="#ecc8a6"/>
    <path d="M26 37.5 L33 36.5 L33.5 44 L26.5 45Z" fill="#6d1f1f"/>
    <path d="M27 38.3 L32.2 37.6 L32.6 43.2 L27.4 43.9Z" fill="none" stroke="#e0b43a" stroke-width="0.6"/>
    <circle cx="28.5" cy="43" r="1.9" fill="#ecc8a6"/>
    <!-- Col de dentelle -->
    <path d="M16 24.5 Q20 27.5 24 24.5 L23 23 Q20 24.8 17 23Z" fill="#f4ecd8"/>
    <!-- Visage -->
    <circle cx="20" cy="16" r="5.8" fill="#ecc8a6"/>
    <circle cx="16.8" cy="18" r="1.2" fill="#e9a184" stroke="none" opacity="0.6"/>
    <circle cx="23.2" cy="18" r="1.2" fill="#e9a184" stroke="none" opacity="0.6"/>
    <path d="M18.2 20.4 Q20 21.4 21.8 20.4" fill="none" stroke="#8a3a2a" stroke-width="0.8"/>
    <!-- Cheveux sous le voile -->
    <path d="M14.2 15 Q14 9.8 20 9.6 Q26 9.8 25.8 15 Q24 11.8 20 12 Q16 11.8 14.2 15Z" fill="#6b3a1e"/>
    <!-- Voile posé sur la tête -->
    <path d="M13.2 14 Q12.5 8 20 7.2 Q27.5 8 26.8 14 Q25 9.6 20 9.6 Q15 9.6 13.2 14Z" fill="#f8f6f0"/>
    <!-- Couronne : bandeau et fleurons d'or, pierres -->
    <path d="M14.5 9.5 L25.5 9.5 L25.2 7.4 L23.4 8.6 L22 5.2 L20 7.8 L18 5.2 L16.6 8.6 L14.8 7.4Z" fill="#e0b43a"/>
    <circle cx="20" cy="8.6" r="0.9" fill="#2a7244" stroke="none"/>
    <circle cx="16.8" cy="8.9" r="0.6" fill="#a8322d" stroke="none"/>
    <circle cx="23.2" cy="8.9" r="0.6" fill="#a8322d" stroke="none"/>
  </g>
  <g fill="#1a1a1a" stroke="none"><circle cx="18" cy="15.8" r="0.72"/><circle cx="22" cy="15.8" r="0.72"/></g>
</svg>
